<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>coding-misk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%230a0614%22/%3E%3Cpath d=%22M6 22V10l5 7 5-7v12M20 22v-6M24 22V10M28 22v-9%22 stroke=%22%23ff2e88%22 stroke-width=%222.5%22 fill=%22none%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mr+Dafoe&family=Russo+One&family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@400;600&family=VT323&display=swap">
</head>
<body>
<header class="bar">
  <div class="brand">
    <div class="logo" role="img" aria-label="coding-misk">
      <span class="logo-grid" aria-hidden="true"></span>
      <span class="logo-chrome" aria-hidden="true" data-text="MISK">MISK</span>
      <span class="logo-script" aria-hidden="true">coding</span>
      <span class="logo-eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
    </div>
    <span class="tag" data-i18n="tag"></span>
  </div>
  <div class="transport">
    <div class="langs" role="group" data-i18n-aria="uiTheme"><button data-uitheme="neon">NEON</button><button data-uitheme="hw">HW</button></div>
    <div class="langs" role="group" data-i18n-aria="lang"><button data-lang="it">IT</button><button data-lang="en">EN</button></div>
  </div>
</header>

<section class="stagewrap" id="stagewrap" data-i18n-aria="stage">
  <canvas id="stage"></canvas>
  <div class="say" id="say" aria-live="polite"></div>
  <div class="hud">
    <div class="readout" id="readout"></div>
    <div class="hud-right">
      <div class="chips" role="group" data-i18n-aria="looks" id="looks"></div>
      <button class="chip fs" id="fs" data-i18n="fullscreen"></button>
    </div>
  </div>
</section>

<div class="work">
  <div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="componi" aria-selected="true" data-i18n="tabComponi"></button>
      <button class="tab" role="tab" data-tab="brani" aria-selected="false" data-i18n="tabBrani"></button>
      <button class="tab" role="tab" data-tab="radio" aria-selected="false" data-i18n="tabRadio"></button>
      <button class="tab" role="tab" data-tab="stili" aria-selected="false" data-i18n="tabStili"></button>
      <button class="tab" role="tab" data-tab="guida" aria-selected="false" data-i18n="tabGuida"></button>
      <button class="tab" role="tab" data-tab="suoni" aria-selected="false" data-i18n="tabSuoni"></button>
      <button class="tab" role="tab" data-tab="riferimenti" aria-selected="false" data-i18n="tabRiferimenti"></button>
    </nav>

    <section id="tab-componi" class="rack">
      <div class="card arranger" id="arranger">
        <div class="arr-top">
          <div class="ctrl"><label class="lbl" for="track-pick" data-i18n="trackPick"></label><select id="track-pick"></select></div>
          <div class="ctrl grow"><label class="lbl" for="track-title" data-i18n="trackTitle"></label><input id="track-title" type="text" maxlength="40" autocomplete="off"></div>
          <span class="dirty" id="dirty" aria-live="polite"></span>
          <div class="actions">
            <button class="btn primary" id="tr-save" data-i18n="save"></button>
            <button class="btn" id="tr-saveas" data-i18n="saveAs"></button>
            <button class="btn" id="tr-new" data-i18n="newTrack"></button>
            <button class="btn" id="tr-export" data-export="current"></button>
            <button class="btn danger" id="tr-del"></button>
          </div>
        </div>
        <div class="arr-mode"><div class="chips" role="group" data-i18n-aria="arrView"><button class="chip" data-arr-mode="timeline" data-i18n="viewTimeline"></button><button class="chip" data-arr-mode="sections" data-i18n="viewSections"></button></div><button class="chip live-chip" id="live-toggle" aria-pressed="false" data-i18n="liveBuild"></button><span class="hint" id="arr-mode-hint"></span></div>
        <div class="arr-scroll">
          <div class="arr-ruler"><span class="ruler-time" id="ruler-time">0:00 / 0:00</span>
            <div class="ruler-track" id="ruler-track" tabindex="0" role="slider" aria-valuemin="1" data-i18n-aria="rulerAria"><span class="ruler-ticks" id="ruler-ticks"></span><span class="ruler-fill" id="ruler-fill"></span><span class="ruler-knob" id="ruler-knob"></span></div></div>
          <div class="arr-strip" id="arr-strip"></div>
          <div class="arr-grid" id="arr-grid" data-i18n-aria="arrangement"></div>
        </div>
        <div class="arr-tools">
          <button class="btn" id="sc-add" data-i18n="addScene"></button>
          <button class="btn icon" id="sc-left" data-i18n-aria="moveLeft">◀</button>
          <button class="btn icon" id="sc-right" data-i18n-aria="moveRight">▶</button>
          <button class="btn" id="sc-del" data-i18n="delScene"></button>
          <span class="tk-add"><select id="tk-type" data-i18n-aria="trackType"></select><button class="btn" id="tk-add" data-i18n="addTrack"></button></span>
          <span class="song-meta" id="arr-total"></span>
        </div>
        <div class="arr-scene">
          <div class="ctrl"><label class="lbl" for="sc-name" data-i18n="sceneName"></label><input id="sc-name" type="text" maxlength="40" autocomplete="off"></div>
          <div class="ctrl"><label class="lbl" for="sc-bars" data-i18n="sceneBars"></label><input id="sc-bars" type="number" min="1" max="64" step="1"></div>
          <div class="ctrl"><label class="lbl" for="sc-fade" data-i18n="sceneEntry"></label><select id="sc-fade"></select></div>
          <div class="ctrl"><div class="row"><label class="lbl" for="bpm">BPM</label><button type="button" class="ramp" id="bpm-ramp" data-i18n-aria="rampToggle">↗</button></div>
            <div class="bpm"><button type="button" data-bpm="-1" data-i18n-aria="bpmDown">−</button><input id="bpm" type="number" min="60" max="200" step="1"><button type="button" data-bpm="1" data-i18n-aria="bpmUp">+</button></div>
            <div class="bpm" id="bpm-end-row" hidden><span class="lbl" data-i18n="bpmEnd"></span><input id="bpm-end" type="number" min="60" max="200" step="1"></div></div>
          <div class="ctrl"><label class="lbl" for="key" data-i18n="key"></label><select id="key"></select></div>
          <div class="ctrl"><label class="lbl" for="prog" data-i18n="chords"></label><select id="prog"></select></div>
          <div class="ctrl"><label class="lbl" for="sc-meter" data-i18n="meter"></label><select id="sc-meter"></select></div>
          <div class="ctrl"><div class="row"><label class="lbl" for="sc-swing">Swing</label><output id="sc-swing-o"></output></div><input type="range" id="sc-swing" min="0" max="1" step="0.05"></div>
        </div>
        <div class="arr-flags">
          <label class="loop"><input type="checkbox" id="sc-crash"> <span data-i18n="crashStart"></span></label>
          <label class="loop"><input type="checkbox" id="sc-breath"> <span data-i18n="breath"></span></label>
          <label class="loop"><input type="checkbox" id="sc-fill"> <span data-i18n="fillOpt"></span></label>
        </div>
        <div class="songbar">
          <button class="btn primary" id="sc-play" data-i18n="playFromScene"></button>
          <button class="btn" id="sc-pause" data-tp="pause"></button>
          <button class="btn" id="sc-stop" data-i18n="stop"></button>
          <label class="loop"><input type="checkbox" id="sc-loop"> <span data-i18n="loopScene"></span></label>
          <label class="loop"><input type="checkbox" id="sc-follow" checked> <span data-i18n="follow"></span></label>
        </div>
        <p class="note" data-i18n="sceneHint"></p>
      </div>
      <div class="card track-panel" id="track-panel"></div>
    </section>

    <section id="tab-brani" hidden>
      <p class="intro" data-i18n="introSongs"></p>
      <div class="lessons" id="songs"></div>
    </section>

    <section id="tab-radio" class="radio" hidden></section>

    <section id="tab-stili" class="lib" hidden></section>

    <section id="tab-guida" hidden>
      <p class="intro" data-i18n-html="introGuide"></p>
      <div class="lessons" id="lessons"></div>
    </section>

    <section id="tab-suoni" hidden>
      <p class="intro" data-i18n="introSounds"></p>
      <div id="sounds"></div>
    </section>

    <section id="tab-riferimenti" hidden>
      <p class="intro" data-i18n="introRefs"></p>
      <div class="refs" id="refs"></div>
    </section>
  </div>

  <aside class="codecol" id="codecol" data-i18n-aria="code">
    <div class="code-resize" id="code-resize" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-aria="codeResize"></div>
    <div class="codehead">
      <div><div class="lbl" data-i18n="liveCode"></div><div class="src" id="src"></div></div>
      <span class="hand-tag" id="hand-tag" hidden data-i18n="handTag"></span>
      <button class="btn primary" id="hand-resume" hidden data-i18n="handResume"></button>
      <span class="hand-from" id="hand-from-wrap" hidden data-i18n-title="handFromTip"><button class="led" id="hand-from" aria-pressed="true" aria-labelledby="hand-from-lbl"></button><span id="hand-from-lbl" data-i18n="handFrom"></span></span>
      <button class="btn" id="back" hidden data-i18n="back"></button>
      <div class="code-tools">
        <button class="btn icon" id="code-full" data-i18n-aria="codeFull" aria-pressed="false">⤢</button>
        <button class="btn icon" id="code-collapse" data-i18n-aria="codeCollapse" aria-pressed="false">⇥</button>
      </div>
    </div>
    <div class="edhost" id="edhost"></div>
    <details class="hand-last" id="hand-last" hidden>
      <summary data-i18n="handLast"></summary>
      <pre id="hand-last-code"></pre>
      <div class="actions"><button class="btn small" id="hand-copy" data-i18n="copy"></button><button class="btn small" id="hand-back" data-i18n="handBack"></button></div>
    </details>
    <div class="actions">
      <a class="btn primary" id="share" href="https://strudel.cc/" target="_blank" rel="noopener" data-i18n="share"></a>
      <button class="btn" id="copy" data-i18n="copy"></button>
      <button class="btn" id="save-code" hidden data-i18n="saveCode"></button>
    </div>
    <p class="note" data-i18n-html="note"></p>
  </aside>
</div>

<footer class="pbar" id="pbar" data-i18n-aria="player">
  <div class="pb-btns">
    <button class="pb-btn" id="pb-prev" data-i18n-aria="prevSong" data-i18n-title="prevSong">⏮</button>
    <button id="play" class="play" aria-pressed="false">▶ Play</button>
    <button class="pb-btn stopbtn" id="stop" data-i18n-aria="stop" data-i18n-title="stop">■</button>
    <button class="pb-btn" id="pb-next" data-i18n-aria="nextSong" data-i18n-title="nextSong">⏭</button>
  </div>
  <div class="pb-mid">
    <div class="pb-now"><span class="pb-onair" id="pb-onair" data-i18n="radioOnAir"></span><span class="pb-title" id="pb-title"></span><span class="pb-pos" id="pb-pos"></span></div>
    <input type="range" id="pb-seek" class="pb-seek" min="0" max="1000" step="1" value="0" data-no-knob data-i18n-aria="seek" data-i18n-title="seek">
  </div>
  <div class="pb-vol">
    <button class="pb-btn" id="pb-mute" aria-pressed="false" data-i18n-aria="mute" data-i18n-title="mute">🔊</button>
    <input type="range" id="pb-volume" min="0" max="100" step="1" data-i18n-aria="volumeAll" data-i18n-title="volumeAll">
    <output id="pb-volume-out"></output>
  </div>
</footer>

<script type="module" src="/src/main.js"></script>
</body>
</html>
