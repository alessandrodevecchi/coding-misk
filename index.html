<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>coding-misk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%230a0614%22/%3E%3Cpath d=%22M6 22V10l5 7 5-7v12M20 22v-6M24 22V10M28 22v-9%22 stroke=%22%23ff2e88%22 stroke-width=%222.5%22 fill=%22none%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mr+Dafoe&family=Russo+One&family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@400;600&family=VT323&family=Share+Tech+Mono&family=Space+Grotesk:wght@400;600&display=swap">
<script>
  // light-theme: the light app theme before the app starts, so a reload does not flash dark
  try { const g = k => JSON.parse(localStorage.getItem(k)); const f = g('coding-misk-ui-follow') === true;
    if (f ? matchMedia('(prefers-color-scheme: light)').matches : g('coding-misk-ui') === 'light') document.documentElement.dataset.ui = 'light'; } catch (e) {}
</script>
</head>
<body>
<header class="bar">
  <div class="brand">
    <div class="logo" role="img" aria-label="coding-misk">
      <span class="logo-grid" aria-hidden="true"></span>
      <span class="logo-chrome" aria-hidden="true" data-text="MISK">MISK</span>
      <span class="logo-script" aria-hidden="true">coding</span>
      <span class="logo-eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
    </div>
    <span class="tag" data-i18n="tag"></span>
  </div>
  <div class="transport">
    <div class="langs" role="group" data-i18n-aria="uiTheme"><button data-uitheme="neon">NEON</button><button data-uitheme="hw">HW</button><button data-uitheme="light" data-i18n="uiLight">LIGHT</button></div>
    <div class="langs" role="group" data-i18n-aria="lang"><button data-lang="it">IT</button><button data-lang="en">EN</button></div>
    <button class="btn icon set-gear" id="open-settings" aria-pressed="false" data-i18n-aria="settings" data-i18n-title="settings">⚙</button>
  </div>
</header>

<div class="stagerow" id="stagerow">
<section class="stagewrap" id="stagewrap" data-i18n-aria="stage">
  <canvas id="stage"></canvas>
  <canvas id="stage-over" hidden aria-hidden="true"></canvas>
  <div class="say" id="say" aria-live="polite"></div>
  <div class="hud">
    <div class="readout" id="readout"></div>
    <div class="hud-right">
      <div class="hud-row">
        <button class="chip look-step" data-look-step="-1" data-i18n-aria="lookPrev" data-i18n-title="lookPrev">◀</button>
        <select class="look-pick" id="looks" data-no-knob data-i18n-aria="looks"></select>
        <button class="chip look-step" data-look-step="1" data-i18n-aria="lookNext" data-i18n-title="lookNext">▶</button>
        <select class="look-pick render-pick" id="renders" data-no-knob data-i18n-aria="renders" data-i18n-title="renders"></select>
        <button class="chip transcript-chip" id="transcript" aria-pressed="false" hidden data-i18n="transcript" data-i18n-title="transcriptTip"></button>
        <button class="chip co-chip" id="code-over-btn" aria-pressed="false" data-i18n="codeOverBtn" data-i18n-title="codeOverTip"></button>
        <button class="chip fs" id="fs" data-i18n="fullscreen"></button>
      </div>
      <div class="soul-ctl" id="soul-ctl" role="group" data-i18n-aria="soulViews" hidden>
        <button class="chip" data-soul="prev" data-i18n-aria="soulPrev">◀</button>
        <span class="soul-name" id="soul-name"></span>
        <button class="chip" data-soul="next" data-i18n-aria="soulNext">▶</button>
        <button class="chip" data-soul="lock" aria-pressed="false" data-i18n-aria="soulLock" data-i18n-title="soulLock"><svg class="lock-ico" viewBox="0 0 12 14" aria-hidden="true"><path d="M3.2 6V4.2a2.8 2.8 0 0 1 5.6 0V6" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="1.5" y="6" width="9" height="7" rx="1.4" fill="currentColor"/></svg></button>
      </div>
    </div>
  </div>
</section>
</div>

<div class="work">
  <div>
    <div class="modes" role="group" data-i18n-aria="modes">
      <button class="mode-btn" data-mode="ascolta" aria-pressed="true"><span class="mode-name" data-i18n="modeListen"></span><small data-i18n="modeListenSub"></small></button>
      <button class="mode-btn" data-mode="lab" aria-pressed="false"><span class="mode-name" data-i18n="modeLab"></span><small data-i18n="modeLabSub"></small></button>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-mode-of="ascolta" data-tab="componi" aria-selected="true" data-i18n="tabComponi"></button>
      <button class="tab" role="tab" data-mode-of="ascolta" data-tab="brani" aria-selected="false" data-i18n="tabBrani"></button>
      <button class="tab" role="tab" data-mode-of="ascolta" data-tab="playlist" aria-selected="false" data-i18n="tabPlaylist"></button>
      <button class="tab" role="tab" data-mode-of="ascolta" data-tab="radio" aria-selected="false" data-i18n="tabRadio"></button>
      <button class="tab" role="tab" data-mode-of="lab" data-tab="artisti" aria-selected="false" data-i18n="tabArtisti" hidden></button>
      <button class="tab" role="tab" data-mode-of="lab" data-tab="stili" aria-selected="false" data-i18n="tabStili" hidden></button>
      <button class="tab" role="tab" data-mode-of="lab" data-tab="generi" aria-selected="false" data-i18n="tabGeneri" hidden></button>
      <button class="tab" role="tab" data-mode-of="lab" data-tab="suoni" aria-selected="false" data-i18n="tabSuoni" hidden></button>
      <button class="tab" role="tab" data-mode-of="lab" data-tab="voci" aria-selected="false" data-i18n="tabVoci" hidden></button>
      <button class="tab" role="tab" data-mode-of="lab" data-tab="pattern" aria-selected="false" data-i18n="tabPattern" hidden></button>
      <button class="tab" role="tab" data-mode-of="lab" data-tab="guida" aria-selected="false" data-i18n="tabGuida" hidden></button>
      <button class="tab" role="tab" data-mode-of="lab" data-tab="lezioni" aria-selected="false" data-i18n="tabLezioni" hidden></button>
      <button class="tab" role="tab" data-mode-of="lab" data-tab="riferimenti" aria-selected="false" data-i18n="tabRiferimenti" hidden></button>
    </nav>

    <section id="tab-componi" class="rack">
      <div class="card arranger" id="arranger">
        <div class="arr-top">
          <div class="ctrl"><label class="lbl" for="track-pick" data-i18n="trackPick"></label><select id="track-pick"></select></div>
          <div class="ctrl grow"><label class="lbl" for="track-title" data-i18n="trackTitle"></label><input id="track-title" type="text" maxlength="40" autocomplete="off"></div>
          <span class="dirty" id="dirty" aria-live="polite"></span>
          <div class="actions">
            <button class="btn primary" id="tr-save" data-i18n="save"></button>
            <button class="btn" id="tr-saveas" data-i18n="saveAs"></button>
            <button class="btn ns-btn" id="tr-new" aria-expanded="false" aria-controls="new-song" data-i18n-title="nsBtnTip"></button>
            <span class="out-combo" id="tr-out-wrap"><button class="btn" id="tr-export" data-export="current"></button><span id="tr-out"></span></span>
            <button class="btn" id="tr-radio" data-i18n="continueRadio" data-i18n-title="continueRadioTip"></button>
            <button class="btn danger" id="tr-del"></button>
            <button class="btn cfg-reset" id="cfg-reset" data-i18n-title="configBackTip"></button>
            <span class="badge cfg-changed" id="cfg-changed" hidden data-i18n="configChanged"></span>
          </div>
        </div>
        <div class="new-song" id="new-song" role="region" data-i18n-aria="newTrack" hidden></div>
        <div class="arr-mode"><div class="chips" role="group" data-i18n-aria="arrView"><button class="chip" data-arr-mode="timeline" data-i18n="viewTimeline"></button><button class="chip" data-arr-mode="sections" data-i18n="viewSections"></button></div><button class="chip live-chip" id="live-toggle" aria-pressed="false" data-i18n="liveBuild"></button><span class="hint" id="arr-mode-hint"></span></div>
        <fieldset class="live-panel" id="live-style-wrap"><legend id="live-legend"></legend>
          <div class="live-profiles" data-live-only="on"><span class="lbl" data-i18n="profileLbl" data-i18n-title="profileHint"></span><div class="chips" id="live-profile" role="radiogroup" data-i18n-aria="profileLbl"></div><span class="badge" id="live-custom" hidden data-i18n="profileCustom"></span><span class="growing-mark" id="live-growing" role="img" hidden data-i18n-title="growingHint" data-i18n-aria="growingHint"></span></div>
          <div class="ctrl" data-live-only="on"><label class="lbl" for="live-style" data-i18n="liveStyle" data-i18n-title="liveStyleHint"></label><select id="live-style" data-no-knob data-i18n-title="liveStyleHint"><option value="blocks" data-i18n="liveBlocks"></option><option value="crescendo" data-i18n="liveCrescendo"></option></select></div>
          <div class="ctrl" data-live-only="crescendo"><label class="lbl" for="live-growth" data-i18n="growthLbl"></label><select id="live-growth" data-no-knob data-i18n-title="growthHint"><option value="crescendo" data-i18n="growth:crescendo"></option><option value="gradual" data-i18n="growth:gradual"></option><option value="natural" data-i18n="growth:natural"></option></select></div>
          <div class="ctrl" data-live-only="crescendo"><label class="lbl" for="live-duration" data-i18n="durLbl"></label><select id="live-duration" data-no-knob data-i18n-title="durHint"><option value="fitted" data-i18n="dur:fitted"></option><option value="free" data-i18n="dur:free"></option><option value="planned" data-i18n="dur:planned" hidden disabled></option></select><p class="hint muted small" id="live-target-off" hidden data-i18n="targetOff"></p></div>
          <div class="live-shape" id="live-shape" data-live-only="crescendo" role="group" aria-labelledby="live-shape-lbl"><div class="live-shape-head"><span class="lbl" id="live-shape-lbl" data-i18n="shapeLbl" data-i18n-title="shapeHint"></span><span class="live-shape-now" id="live-shape-now"></span></div>
            <div class="ctrl"><label class="lbl" for="live-opening" data-i18n="openingLbl"></label><select id="live-opening" data-no-knob data-i18n-title="openingHint"></select></div>
            <div class="ctrl"><label class="lbl" for="live-pace" data-i18n="paceLbl"></label><select id="live-pace" data-no-knob data-i18n-title="paceHint"></select></div>
            <div class="ctrl"><label class="lbl" for="live-development" data-i18n="developmentLbl"></label><select id="live-development" data-no-knob data-i18n-title="developmentHint"></select></div>
          </div>
          <div class="ctrl" data-live-only="crescendo"><label class="lbl" for="live-code" data-i18n="liveCodeView"></label><select id="live-code" data-no-knob data-i18n-title="liveCompactHint"><option value="now" data-i18n="liveCodeNow"></option><option value="compact" data-i18n="liveCodeCompact"></option><option value="track" data-i18n="liveCodeTrack"></option><option value="sections" data-i18n="liveCodeSections"></option></select></div>
          <div class="ctrl" data-live-only="crescendo"><label class="lbl" for="live-gen" data-i18n="liveGen"></label><select id="live-gen" data-no-knob data-i18n-title="liveGenHint"><option value="standard" data-i18n="liveGenStandard"></option><option value="idiomatic" data-i18n="liveGenIdiomatic"></option></select></div>
          <div class="ctrl"><label class="lbl" for="live-comments" data-i18n="commentsLbl"></label><select id="live-comments" data-no-knob data-i18n-title="commentsHint"><option value="all" data-i18n="comments:all"></option><option value="essential" data-i18n="comments:essential"></option><option value="none" data-i18n="comments:none"></option><option value="custom" data-i18n="comments:custom" disabled></option></select>
            <div class="chips"><button class="chip" id="live-c-tracks" aria-pressed="true" data-i18n="cOpt:tracks" data-i18n-title="cOptHint:tracks"></button><button class="chip" id="live-c-notes" aria-pressed="true" data-i18n="cOpt:notes" data-i18n-title="cOptHint:notes"></button><button class="chip" id="live-c-steps" aria-pressed="true" data-i18n="cOpt:steps" data-i18n-title="cOptHint:steps"></button><button class="chip" id="live-c-voice" aria-pressed="true" data-i18n="cOpt:voice" data-i18n-title="cOptHint:voice"></button></div></div>
          <div class="ctrl"><label class="lbl" for="live-fns" data-i18n="fnsLbl"></label><select id="live-fns" data-no-knob data-i18n-title="fnsHint"><option value="full" data-i18n="fns:full"></option><option value="short" data-i18n="fns:short"></option><option value="mixer" data-i18n="fns:mixer"></option><option value="compact" data-i18n="fns:compact"></option><option value="custom" data-i18n="fns:custom" disabled></option></select>
            <div class="chips"><button class="chip" id="live-f-fnBus" aria-pressed="false" data-i18n="fOpt:fnBus" data-i18n-title="fOptHint:fnBus"></button><button class="chip" id="live-f-fnLevel" aria-pressed="false" data-i18n="fOpt:fnLevel" data-i18n-title="fOptHint:fnLevel"></button><button class="chip" id="live-f-fnCrunch" aria-pressed="false" data-i18n="fOpt:fnCrunch" data-i18n-title="fOptHint:fnCrunch"></button><button class="chip" id="live-f-fnVoice" aria-pressed="false" data-i18n="fOpt:fnVoice" data-i18n-title="fOptHint:fnVoice"></button><button class="chip" id="live-f-fnLib" aria-pressed="false" data-i18n="fOpt:fnLib" data-i18n-title="fOptHint:fnLib"></button><button class="chip" id="live-f-fnSong" aria-pressed="false" data-i18n="fOpt:fnSong" data-i18n-title="fOptHint:fnSong"></button><button class="chip" id="live-f-fnLanes" aria-pressed="false" data-i18n="fOpt:fnLanes" data-i18n-title="fOptHint:fnLanes"></button></div></div>
          <div class="ctrl"><span class="lbl" data-i18n="liveOptions"></span><div class="chips"><button class="chip" id="live-title" aria-pressed="true" data-i18n="liveTitle" data-i18n-title="liveTitleHint"></button><button class="chip" id="live-hl" aria-pressed="false" data-i18n="liveHl" data-i18n-title="liveHlHint"></button><button class="chip" id="live-wrap" aria-pressed="false" data-i18n="liveWrap" data-i18n-title="liveWrapHint"></button><button class="chip" id="live-human" data-live-only="on" aria-pressed="false" data-i18n="liveHuman" data-i18n-title="liveHumanHint"></button><button class="chip" id="live-mistakes" data-live-only="on" aria-pressed="true" data-i18n="liveMistakes" data-i18n-title="liveMistakesHint"></button></div></div>
          <div class="ctrl live-voices" id="live-voices" role="group" aria-labelledby="live-voices-lbl"><span class="lbl" id="live-voices-lbl" data-i18n="voicesLbl" data-i18n-title="voicesHint"></span><button class="plain link vt-link" data-open-voices="voices" data-i18n="phVoicesLink" data-i18n-title="phVoicesLinkTip"></button><div class="voices-row voice-block" id="live-narrator-row"><div class="vb-head"><span class="lbl voices-sub" id="live-narrator-sub" data-i18n="narratorLbl"></span><button class="vswitch" id="live-narrator" aria-pressed="true" data-i18n-title="liveNarratorHint"><span class="vs-lamp" aria-hidden="true"></span><span class="vs-txt" data-i18n="liveNarrator"></span></button></div><p class="hint small vb-note" id="live-narrator-note" data-i18n="narratorNoLive" hidden></p><div class="chips vb-main"><label class="lbl" for="live-narrator-style" data-i18n="narratorStyleLbl" data-i18n-title="narratorStyleHint"></label><select id="live-narrator-style" data-no-knob data-i18n-title="narratorStyleHint"><option value="auto" data-i18n="narratorStyle:auto"></option><option value="explain" data-i18n="narratorStyle:explain"></option><option value="poetic" data-i18n="narratorStyle:poetic"></option></select><button class="chip" id="live-narrated" aria-pressed="false" data-i18n="liveNarrated" data-i18n-title="liveNarratedHint"></button></div><div class="vb-parts" id="live-narrator-parts"></div></div><div class="voices-row voice-block" id="live-vinst"></div></div>
        </fieldset>
        <div class="arr-scroll">
          <div class="arr-ruler"><span class="ruler-time" id="ruler-time">0:00 / 0:00</span>
            <div class="ruler-track" id="ruler-track" tabindex="0" role="slider" aria-valuemin="1" data-i18n-aria="rulerAria"><span class="ruler-ticks" id="ruler-ticks"></span><span class="ruler-fill" id="ruler-fill"></span><span class="ruler-knob" id="ruler-knob"></span></div></div>
          <div class="arr-strip" id="arr-strip"></div>
          <div class="arr-grid" id="arr-grid" data-i18n-aria="arrangement"></div>
        </div>
        <div class="arr-tools">
          <button class="btn" id="sc-add" data-i18n="addScene"></button>
          <button class="btn icon" id="sc-left" data-i18n-aria="moveLeft">◀</button>
          <button class="btn icon" id="sc-right" data-i18n-aria="moveRight">▶</button>
          <button class="btn" id="sc-del" data-i18n="delScene"></button>
          <span class="tk-add"><select id="tk-type" data-i18n-aria="trackType"></select><button class="btn" id="tk-add" data-i18n="addTrack"></button></span>
          <span class="song-meta" id="arr-total"></span>
        </div>
        <div class="arr-scene">
          <div class="ctrl"><label class="lbl" for="sc-name" data-i18n="sceneName"></label><input id="sc-name" type="text" maxlength="40" autocomplete="off"></div>
          <div class="ctrl"><label class="lbl" for="sc-bars" data-i18n="sceneBars"></label><input id="sc-bars" type="number" min="1" max="64" step="1"></div>
          <div class="ctrl"><label class="lbl" for="sc-fade" data-i18n="sceneEntry"></label><select id="sc-fade"></select></div>
          <div class="ctrl"><div class="row"><label class="lbl" for="bpm">BPM</label><button type="button" class="ramp" id="bpm-ramp" data-i18n-aria="rampToggle">↗</button></div>
            <div class="bpm"><button type="button" data-bpm="-1" data-i18n-aria="bpmDown">−</button><input id="bpm" type="number" min="60" max="200" step="1"><button type="button" data-bpm="1" data-i18n-aria="bpmUp">+</button></div>
            <div class="bpm" id="bpm-end-row" hidden><span class="lbl" data-i18n="bpmEnd"></span><input id="bpm-end" type="number" min="60" max="200" step="1"></div></div>
          <div class="ctrl"><label class="lbl" for="key" data-i18n="key"></label><select id="key"></select></div>
          <div class="ctrl"><label class="lbl" for="prog" data-i18n="chords"></label><select id="prog"></select></div>
          <div class="ctrl"><label class="lbl" for="sc-meter" data-i18n="meter"></label><select id="sc-meter"></select></div>
          <div class="ctrl"><div class="row"><label class="lbl" for="sc-swing">Swing</label><output id="sc-swing-o"></output></div><input type="range" id="sc-swing" min="0" max="1" step="0.05"></div>
        </div>
        <div class="arr-flags">
          <label class="loop"><input type="checkbox" id="sc-crash"> <span data-i18n="crashStart"></span></label>
          <label class="loop"><input type="checkbox" id="sc-breath"> <span data-i18n="breath"></span></label>
          <label class="loop"><input type="checkbox" id="sc-fill"> <span data-i18n="fillOpt"></span></label>
        </div>
        <div class="songbar">
          <button class="btn primary" id="sc-play" data-i18n="playFromScene"></button>
          <button class="btn" id="sc-pause" data-tp="pause"></button>
          <button class="btn" id="sc-stop" data-i18n="stop"></button>
          <label class="loop"><input type="checkbox" id="sc-loop"> <span data-i18n="loopScene"></span></label>
          <label class="loop"><input type="checkbox" id="sc-follow" checked> <span data-i18n="follow"></span></label>
        </div>
        <p class="note" data-i18n="sceneHint"></p>
      </div>
      <div class="card track-panel" id="track-panel"></div>
    </section>

    <section id="tab-brani" hidden>
      <p class="intro" data-i18n="introSongs"></p>
      <div class="songs-bar card" id="songs-bar"></div>
      <div class="lessons" id="songs"></div>
      <p class="note" id="songs-hint"></p>
    </section>

    <section id="tab-playlist" class="playlists" hidden></section>

    <section id="tab-generi" class="genres" hidden></section>

    <section id="tab-impostazioni" class="settings" hidden></section>

    <section id="tab-radio" class="radio" hidden></section>

    <section id="tab-artisti" class="lib" hidden></section>

    <section id="tab-stili" class="lib" hidden></section>

    <section id="tab-guida" class="guide" hidden>
      <p class="intro" data-i18n="introGuide"></p>
      <div id="guide"></div>
    </section>

    <section id="tab-lezioni" hidden>
      <p class="intro" data-i18n-html="introLessons"></p>
      <div class="lessons" id="lessons"></div>
    </section>

    <section id="tab-suoni" hidden>
      <p class="intro" data-i18n="introSounds"></p>
      <div id="sounds"></div>
    </section>

    <section id="tab-voci" class="voices-tab" hidden></section>

    <section id="tab-pattern" hidden>
      <p class="intro" data-i18n="introPatterns"></p>
      <div id="patterns"></div>
    </section>

    <section id="tab-riferimenti" hidden>
      <p class="intro" data-i18n="introRefs"></p>
      <div class="refs" id="refs"></div>
    </section>
  </div>

  <aside class="codecol" id="codecol" data-i18n-aria="code">
    <div class="code-resize" id="code-resize" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-aria="codeResize"></div>
    <div class="codehead">
      <div><div class="lbl" data-i18n="liveCode"></div><div class="src" id="src"></div></div>
      <span class="hand-tag" id="hand-tag" hidden data-i18n="handTag"></span>
      <button class="btn primary" id="hand-resume" hidden data-i18n="handResume"></button>
      <button class="btn" id="hand-save" hidden data-i18n="handSave" data-i18n-title="handSaveTip"></button>
      <span class="hand-from" id="hand-from-wrap" hidden data-i18n-title="handFromTip"><button class="led" id="hand-from" aria-pressed="true" aria-labelledby="hand-from-lbl"></button><span id="hand-from-lbl" data-i18n="handFrom"></span></span>
      <button class="btn" id="back" hidden data-i18n="back"></button>
      <div class="code-tools">
        <button class="btn icon" id="code-full" data-i18n-aria="codeFull" aria-pressed="false">⤢</button>
        <button class="btn icon" id="code-collapse" data-i18n-aria="codeCollapse" aria-pressed="false">⇥</button>
      </div>
    </div>
    <div class="edhost ct-wait" id="edhost"></div>
    <details class="hand-last" id="prelude" hidden>
      <summary data-i18n="preludeShow" data-i18n-title="preludeHint"></summary>
      <pre id="prelude-code"></pre>
    </details>
    <details class="hand-last" id="hand-last" hidden>
      <summary data-i18n="handLast"></summary>
      <pre id="hand-last-code"></pre>
      <div class="actions"><button class="btn small" id="hand-copy" data-i18n="copy"></button><button class="btn small" id="hand-back" data-i18n="handBack"></button><button class="btn small" id="hand-save-last" data-i18n="handSave" data-i18n-title="handSaveTip"></button></div>
    </details>
    <div class="actions">
      <a class="btn primary" id="share" href="https://strudel.cc/" target="_blank" rel="noopener" data-i18n="share"></a>
      <button class="btn" id="copy" data-i18n="copy"></button>
      <button class="btn" id="save-code" hidden data-i18n="saveCode"></button>
    </div>
    <p class="note" data-i18n-html="note"></p>
  </aside>
</div>

<footer class="pbar" id="pbar" data-i18n-aria="player">
  <div class="pb-btns">
    <button class="pb-btn" id="pb-prev" data-i18n-aria="prevSong" data-i18n-title="prevSong">⏮</button>
    <button id="play" class="play" aria-pressed="false">▶ Play</button>
    <span class="growing-mark play-growing" id="play-growing" role="img" hidden data-i18n-title="growingHint" data-i18n-aria="growingHint"></span>
    <button class="pb-btn stopbtn" id="stop" data-i18n-aria="stop" data-i18n-title="stop">■</button>
    <button class="pb-btn" id="pb-next" data-i18n-aria="nextSong" data-i18n-title="nextSong">⏭</button>
    <button class="pb-btn pb-mode" id="pb-shuffle" aria-pressed="false" data-i18n-aria="shuffle" data-i18n-title="shuffle"></button>
    <button class="pb-btn pb-mode" id="pb-repeat" aria-pressed="false"></button>
    <button class="pb-btn pb-mode" id="pb-mix" aria-pressed="false" data-i18n-aria="mixTip" data-i18n-title="mixTip"></button>
  </div>
  <div class="pb-mid">
    <div class="pb-now"><span class="pb-onair" id="pb-onair" data-i18n="radioOnAir"></span><span class="pb-title" id="pb-title"></span><span class="pb-pos" id="pb-pos"></span><span class="pb-bar" id="pb-bar"></span></div>
    <input type="range" id="pb-seek" class="pb-seek" min="0" max="1000" step="1" value="0" data-no-knob data-i18n-aria="seek" data-i18n-title="seek">
  </div>
  <div class="pb-vol">
    <button class="pb-btn" id="pb-mute" aria-pressed="false" data-i18n-aria="mute" data-i18n-title="mute">🔊</button>
    <input type="range" id="pb-volume" min="0" max="100" step="1" data-i18n-aria="volumeAll" data-i18n-title="volumeAll">
    <output id="pb-volume-out"></output>
  </div>
</footer>

<script type="module" src="/src/main.js"></script>
</body>
</html>
