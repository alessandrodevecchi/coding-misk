<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decode tab</title>
<!-- Static mockup for the track-to-code change: the Decode tab in the real app layout (index.html): the header, the
     shared stage #stagewrap with its HUD on top, then .work with the modes, the tabs and the Decode panel on the left
     and the code column #codecol on the right (below on phones), and the player bar. Four states: empty, level A
     playing, level B analysing, level B result. Neon tokens from src/style.css. Not part of the app.
     ?only=empty|live|analysing|full shows one state; ?phone=1 lays it out 400 px wide, stacked as the app does. -->
<style>
  :root {
    --bg: #0d0818; --panel: #160f26; --panel2: #1f1534; --line: #3a2a5c;
    --ink: #f3ecff; --muted: #a597c7; --a1: #ff4fa3; --a2: #ffb347; --cy: #00e5ff;
    --chip-bg: rgba(0,0,0,.45); --on-accent: #160f26;
    --ui: "Chakra Petch", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #05030a; color: var(--ink); font: 15px/1.5 var(--ui); }
  h1.doc { font-size: 15px; margin: 16px; color: var(--muted); font-weight: 600; }
  .frames { display: grid; gap: 28px; padding: 0 16px 32px; }
  .frame { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; width: 1440px; max-width: 100%; position: relative; padding: 0 16px 76px; }
  .phone .frame { width: 400px; }
  .flabel { position: absolute; left: 50%; transform: translateX(-50%); top: 6px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); background: var(--chip-bg); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; z-index: 5; white-space: nowrap; }
  .ico { width: 16px; height: 16px; flex: none; }
  .lbl { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .note { margin: 0; font-size: 12px; color: var(--muted); }
  .muted { color: var(--muted); }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel2); border-radius: 6px; padding: 7px 12px; font: 13px var(--ui); color: var(--ink); white-space: nowrap; }
  .btn.primary { border-color: var(--a1); color: var(--a1); }
  .btn.fill { background: var(--a1); color: var(--on-accent); border-color: var(--a1); font-weight: 700; }
  .btn.icon { min-width: 38px; justify-content: center; padding: 7px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid color-mix(in srgb, var(--ink) 30%, transparent); background: var(--chip-bg); border-radius: 999px; padding: 4px 12px; font: 13px var(--ui); color: var(--ink); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .chip[aria-pressed="true"] { border-color: var(--a1); color: var(--a1); box-shadow: 0 0 10px color-mix(in srgb, var(--a1) 50%, transparent); }
  select, .sel { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 28px 6px 10px; min-height: 36px; font: 14px var(--ui); color: var(--ink); display: inline-flex; align-items: center; position: relative; white-space: nowrap; }
  .sel::after { content: ''; position: absolute; right: 10px; top: 50%; margin-top: -3px; border: 5px solid transparent; border-top-color: var(--a1); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }

  /* header (.bar) */
  .bar { display: flex; align-items: center; gap: 12px 20px; padding: 12px 0; flex-wrap: wrap; }
  .logo { position: relative; width: 200px; height: 64px; }
  .logo .chrome { position: absolute; left: 46px; top: 20px; font: 700 38px/1 "Russo One", var(--ui); transform: skewX(-10deg); color: transparent;
    background: linear-gradient(180deg, #fff 0%, #d4ecff 28%, #7d9fe0 47%, #1a0f35 50%, #ff4fa3 53%, #ffc2e3 76%, #fff 100%); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 0 6px var(--a1)); }
  .logo .script { position: absolute; left: 0; top: -2px; font: italic 700 26px/1 "Brush Script MT", cursive; color: #fff; transform: rotate(-9deg); text-shadow: 0 0 4px var(--cy), 0 0 12px var(--cy); }
  .logo .eq { position: absolute; right: 0; bottom: 8px; display: flex; gap: 2px; align-items: flex-end; }
  .logo .eq i { width: 4px; background: var(--cy); box-shadow: 0 0 6px var(--cy); }
  .brand small { display: block; font-size: 11px; letter-spacing: .2em; color: var(--muted); }
  .transport { display: flex; gap: 10px; margin-left: auto; align-items: center; }
  .langs { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .langs span { background: var(--panel2); min-height: 36px; padding: 0 10px; display: grid; place-items: center; font-weight: 700; font-size: 12px; letter-spacing: .1em; color: var(--muted); }
  .langs span.on { background: var(--a1); color: var(--bg); }
  .phone .brand { width: 100%; }
  .phone .transport { margin-left: 0; }

  /* shared stage (#stagewrap) with its HUD */
  .stagewrap { position: relative; margin-top: 16px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); height: 420px;
    background: radial-gradient(ellipse at 50% 110%, rgba(255,79,163,.22), transparent 60%), linear-gradient(#0a0614, #120a22 70%, #160a26); }
  .phone .stagewrap { height: 360px; }
  .scope { position: absolute; left: 14%; right: 14%; top: 30px; height: 92px; border: 1px solid rgba(255,255,255,.08); background-image: radial-gradient(rgba(255,255,255,.12) 1px, transparent 1px); background-size: 6px 6px; }
  .scope svg { width: 100%; height: 100%; }
  .phone .scope { left: 12%; right: 12%; top: 60px; height: 70px; }
  .rigrow { position: absolute; left: 2%; right: 2%; bottom: 70px; display: flex; justify-content: space-between; align-items: flex-end; }
  .rigrow .inst { display: grid; justify-items: center; gap: 4px; }
  .rigrow .inst span { font: 600 14px var(--mono); letter-spacing: .08em; color: rgba(243,236,255,.35); }
  .rigrow svg { filter: drop-shadow(0 0 5px currentColor); }
  .phone .rigrow { bottom: 50px; }
  .phone .rigrow svg { height: 64px; width: auto; }
  .phone .rigrow .inst:nth-child(n+7) { display: none; }
  .phone .rigrow .inst span { font-size: 8px; }
  .stagefloor { position: absolute; left: 0; right: 0; bottom: 0; height: 70px; background: repeating-linear-gradient(0deg, rgba(255,79,163,.25) 0 1px, transparent 1px 16px); opacity: .5; }
  .readout { position: absolute; left: 12px; top: 12px; font: 13px/1.4 var(--mono); white-space: pre; text-shadow: 0 0 6px #000; z-index: 2; }
  .hud-right { position: absolute; right: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; z-index: 2; }
  .hud-right .chip { background: rgba(0,0,0,.55); }
  .hud-right .sel { min-height: 32px; border-radius: 999px; background: rgba(0,0,0,.55); }
  .phone .hud-right { left: 12px; right: 12px; top: 58px; justify-content: flex-start; flex-wrap: nowrap; overflow: hidden; }
  .lit-i { color: var(--a1) !important; }
  .codeover { position: absolute; left: 16px; top: 140px; font: 15px/1.9 var(--mono); z-index: 1; }
  .codeover .ln > span.t { background: rgba(13,8,24,.66); }

  /* work: left column and the code column */
  .work { display: grid; gap: 20px; margin-top: 20px; grid-template-columns: minmax(0, 1fr) minmax(360px, 42%); align-items: start; }
  .phone .work { grid-template-columns: minmax(0, 1fr); }
  .modes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-bottom: 14px; }
  .mode-btn { border: 1px solid var(--line); background: var(--panel2); border-radius: 10px; padding: 10px; text-align: center; color: var(--muted); }
  .mode-btn b { display: block; color: var(--ink); letter-spacing: .14em; font-size: 15px; }
  .mode-btn small { font-size: 11px; }
  .mode-btn.on { background: var(--a1); border-color: var(--a1); color: #fff; box-shadow: 0 0 18px color-mix(in srgb, var(--a1) 50%, transparent); }
  .mode-btn.on b { color: #fff; }
  .phone .mode-btn small { display: none; }
  .tabs { display: flex; gap: 4px; overflow: hidden; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  .tab { border-bottom: 2px solid transparent; padding: 8px 14px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; font-size: 15px; }
  .tab.on { color: var(--ink); border-bottom-color: var(--a1); }
  .phone .tab { padding: 8px 9px; font-size: 13px; }

  /* the Decode panel */
  .dhead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .dhead h2 { margin: 0; font-size: 21px; }
  .dhead p { margin: 0; font-size: 13px; color: var(--muted); }
  .help { margin-left: auto; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--a1); color: var(--a1); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  .dpanel { display: grid; gap: 12px; }
  .drop { border: 2px dashed color-mix(in srgb, var(--a1) 55%, var(--line)); border-radius: 14px; padding: 30px 16px; display: grid; justify-items: center; gap: 10px; text-align: center;
    background: radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--a1) 12%, transparent), transparent 70%), var(--panel); }
  .drop .big { width: 64px; height: 64px; color: var(--a1); filter: drop-shadow(0 0 8px color-mix(in srgb, var(--a1) 60%, transparent)); }
  .drop h3 { margin: 0; font-size: 17px; }
  .drop .fmts { font: 12px var(--mono); color: var(--muted); }
  .rrow { display: grid; grid-template-columns: 30px 1fr auto auto auto; align-items: center; gap: 10px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); }
  .rrow b { display: block; font-size: 14px; } .rrow small { color: var(--muted); font-size: 12px; }
  .thumb { width: 30px; height: 30px; border-radius: 6px; background: linear-gradient(135deg, #2a1846, #120a20); display: grid; place-items: center; color: var(--a2); }
  .badge { font-size: 11px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; color: var(--muted); white-space: nowrap; }
  .badge.ok { border-color: var(--cy); color: var(--cy); }
  .phone .rrow { grid-template-columns: 30px 1fr auto; }
  .phone .rrow .badge, .phone .rrow .len { display: none; }
  .filerow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .filerow .fname { font: 13px var(--mono); color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px 12px; align-items: end; }
  .phone .grid2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .field { display: grid; gap: 4px; min-width: 0; }
  .field input { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; color: var(--ink); font: 15px var(--ui); min-width: 0; width: 100%; min-height: 36px; }
  .toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; min-height: 36px; }
  .sw { width: 34px; height: 18px; border-radius: 999px; background: var(--a1); position: relative; box-shadow: 0 0 8px color-mix(in srgb, var(--a1) 60%, transparent); flex: none; }
  .sw::after { content: ''; position: absolute; right: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--on-accent); }
  .ctls { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: end; }
  .ctl { display: grid; gap: 4px; }
  .tempo { display: inline-flex; align-items: center; gap: 8px; font: 13px var(--mono); background: var(--chip-bg); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; min-height: 36px; }
  .tempo b { font-size: 16px; color: var(--a2); }
  .tempo .x { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; min-height: 36px; }
  .seg span { padding: 0 12px; font-size: 14px; background: var(--panel2); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; border-right: 1px solid var(--line); }
  .seg span:last-child { border-right: 0; }
  .seg span.on { background: color-mix(in srgb, var(--a1) 18%, var(--panel2)); color: var(--a1); }
  .seg small { font-size: 10px; letter-spacing: .1em; opacity: .8; }
  .fold { color: var(--muted); font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .tracks { display: grid; gap: 8px; }
  .trk { display: grid; grid-template-columns: 24px 1fr 72px auto; gap: 8px; align-items: center; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); }
  .trk.silent { opacity: .55; }
  .trk .nm { font-size: 14px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trk .nm small { font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 6px; }
  .trk .ti { color: var(--a2); display: grid; place-items: center; }
  .trk.orig .ti { color: var(--cy); }
  .meter { height: 8px; border-radius: 2px; background: #120a20; overflow: hidden; }
  .meter i { display: block; height: 100%; background: linear-gradient(90deg, #3dffb0, var(--a2) 75%, var(--a1)); }
  .ms { display: flex; gap: 4px; }
  .mini { width: 26px; height: 24px; border-radius: 5px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); font: 700 12px var(--ui); display: grid; place-items: center; }
  .mini.on { border-color: var(--a1); color: var(--a1); }
  .mini.by.on { border-style: dashed; }
  .xf { display: grid; gap: 6px; }
  .xf .ends { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .xf .ends .on { color: var(--a1); }
  .rail { position: relative; height: 22px; }
  .rail::before { content: ''; position: absolute; left: 0; right: 0; top: 9px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--cy), var(--a1)); opacity: .7; }
  .rail .mid { position: absolute; left: 50%; top: 4px; width: 1px; height: 14px; background: var(--muted); }
  .rail .knob { position: absolute; top: 2px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 10px var(--a1); }
  .legend { font-size: 11px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .legend .mini { width: 20px; height: 18px; font-size: 10px; }
  .strip { display: flex; height: 26px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); position: relative; }
  .strip span { display: grid; place-items: center; font-size: 11px; border-right: 1px solid var(--bg); white-space: nowrap; overflow: hidden; }
  .strip .pl { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #fff; box-shadow: 0 0 8px #fff; }
  .growcard { display: grid; gap: 8px; border-color: var(--a1); }
  .growcard .gh { display: flex; gap: 10px; align-items: center; }
  .growcard .gh svg { width: 34px; height: 34px; color: var(--a1); }
  .growcard h3 { margin: 0; font-size: 15px; }
  .pbarx { height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; }
  .pbarx i { display: block; height: 100%; width: 62%; background: linear-gradient(90deg, var(--a1), var(--a2)); box-shadow: 0 0 10px var(--a1); }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-size: 13px; }
  .steps li { display: flex; gap: 8px; align-items: center; }
  .steps .done { color: var(--cy); } .steps .now { color: var(--a2); } .steps .todo { color: var(--muted); }
  .grow-ring { transform-box: view-box; transform-origin: 8px 8px; }

  /* the code column (#codecol) */
  .codecol { display: grid; gap: 10px; min-width: 0; }
  .codehead { display: flex; align-items: flex-start; gap: 8px; }
  .codehead .src { font: 13px var(--mono); color: var(--cy); }
  .code-tools { margin-left: auto; display: flex; gap: 6px; }
  .edhost { border: 1px solid var(--line); border-radius: 10px; background: #0b0716; min-height: 360px; padding: 10px 0; font: 15px/1.55 var(--mono); overflow: hidden; }
  .phone .edhost { font-size: 13px; min-height: 280px; }
  .ln { display: flex; white-space: pre; }
  .ln .no { width: 34px; text-align: right; padding-right: 10px; color: #5b4f7a; flex: none; }
  .ln .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .ln.cm .t { color: #9488b8; font-style: italic; }
  .ln.edit { background: color-mix(in srgb, var(--a1) 16%, transparent); }
  .ln.mutedl .t { opacity: .5; }
  .k { color: var(--a1); } .s { color: #b8f26b; } .f { color: #7ce7ff; } .n { color: var(--a2); }
  .lit { outline: 2px solid var(--cy); outline-offset: 1px; border-radius: 2px; }
  .caret { display: inline-block; width: .55em; height: 1.1em; vertical-align: -3px; background: #fff; }
  .empty-code { color: var(--muted); font: 13px var(--ui); padding: 10px 16px; }
  .hidden-code { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .kbd { font: 12px var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }

  /* player bar (.pbar) */
  .pbar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: rgba(13,8,24,.96); border-top: 1px solid var(--line); }
  .pb-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink); flex: none; }
  .pb-btn.dis { opacity: .35; }
  .play { border: 2px solid var(--a1); border-radius: 999px; padding: 6px 18px; font-weight: 700; letter-spacing: .1em; color: var(--ink); display: inline-flex; gap: 8px; align-items: center; box-shadow: 0 0 12px color-mix(in srgb, var(--a1) 45%, transparent); flex: none; }
  .pb-mid { flex: 1; min-width: 0; }
  .pb-now { display: flex; gap: 10px; font-size: 14px; font-weight: 600; justify-content: space-between; }
  .pb-now span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pb-now small { font: 12px var(--mono); color: var(--muted); font-weight: 400; white-space: nowrap; }
  .seek { height: 4px; border-radius: 2px; background: var(--panel2); margin-top: 8px; position: relative; }
  .seek i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--a1); }
  .vol { display: flex; gap: 8px; align-items: center; }
  .vol .rl { width: 100px; height: 4px; background: var(--a1); border-radius: 2px; }
  .phone .pb-mode, .phone .vol .rl, .phone .pb-now span { display: none; }
  .phone .pb-now small { font-size: 11px; white-space: normal; line-height: 1.25; }
  .phone .pbar { gap: 6px; padding: 10px 8px; }
  .phone .play { padding: 6px 12px; }
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-drop" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 40v12a4 4 0 0 0 4 4h44a4 4 0 0 0 4-4V40"/><path d="M32 8v30M22 28l10 10 10-10"/></g><g stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M14 47v2M19 44v8M24 46v4M40 46v4M45 43v10M50 47v2"/></g></symbol>
  <symbol id="i-wave" viewBox="0 0 16 16"><g stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 7v2M5 4v8M8 6v4M11 3v10M14 7v2"/></g></symbol>
  <symbol id="i-code" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 4L2 8l3.5 4M10.5 4L14 8l-3.5 4"/></g></symbol>
  <symbol id="i-drum" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="8" cy="5" rx="6" ry="2.2"/><path d="M2 5v6c0 1.2 2.7 2.2 6 2.2s6-1 6-2.2V5"/></g></symbol>
  <symbol id="i-bass" viewBox="0 0 16 16"><path d="M2 11c2-4 4 2 6-2s4 2 6-2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <symbol id="i-chord" viewBox="0 0 16 16"><g fill="currentColor"><circle cx="4" cy="12" r="1.8"/><circle cx="8" cy="8" r="1.8"/><circle cx="12" cy="4" r="1.8"/></g></symbol>
  <symbol id="i-lead" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12V3l7-1.5v9"/><circle cx="4.5" cy="12" r="1.7"/><circle cx="11.5" cy="10.5" r="1.7"/></g></symbol>
  <symbol id="i-play" viewBox="0 0 16 16"><path d="M5 3l8 5-8 5z" fill="currentColor"/></symbol>
  <symbol id="i-pause" viewBox="0 0 16 16"><g fill="currentColor"><rect x="4" y="3" width="3" height="10" rx=".5"/><rect x="9" y="3" width="3" height="10" rx=".5"/></g></symbol>
  <symbol id="i-stop" viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1" fill="currentColor"/></symbol>
  <symbol id="i-prev" viewBox="0 0 16 16"><path d="M4 3v10M13 3L6 8l7 5z" fill="currentColor" stroke="currentColor" stroke-width="1.2"/></symbol>
  <symbol id="i-next" viewBox="0 0 16 16"><path d="M12 3v10M3 3l7 5-7 5z" fill="currentColor" stroke="currentColor" stroke-width="1.2"/></symbol>
  <symbol id="i-shuf" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h3l6 8h3M2 12h3l6-8h3M12 2l2 2-2 2M12 10l2 2-2 2"/></g></symbol>
  <symbol id="i-rep" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5h9M10 3l2 2-2 2M13 9v2H4M6 13l-2-2 2-2"/></g></symbol>
  <symbol id="i-spk" viewBox="0 0 16 16"><path d="M2 6h2.5L8 3v10L4.5 10H2z" fill="currentColor"/><path d="M10.5 5.5a3.5 3.5 0 0 1 0 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-open" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2.5h4.5V7M13.5 2.5L7 9"/><path d="M12 9.5v3a1 1 0 0 1-1 1H3.5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3"/></g></symbol>
  <symbol id="i-export" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8M5 7l3 3 3-3M3 12.5h10"/></g></symbol>
  <symbol id="i-file" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4 1.8h5.5L12.5 5v9.2H4z"/><path d="M9.5 1.8V5h3"/></g></symbol>
  <symbol id="i-chev" viewBox="0 0 16 16"><path d="M6 3.5L10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-tap" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="2" y="9" width="12" height="4" rx="1"/><path d="M8 2v4M5.5 4.5L8 2l2.5 2.5"/></g></symbol>
  <symbol id="i-grow" viewBox="0 0 16 16"><path class="grow-ring" d="M8 1.4a6.6 6.6 0 1 1-6.2 4.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M8 11.8V7.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M8 8.4c0-1.7 1.2-2.7 2.9-2.7 0 1.7-1.2 2.7-2.9 2.7z" fill="currentColor"/><path d="M8 9.7c0-1.3-.9-2.1-2.3-2.1 0 1.3.9 2.1 2.3 2.1z" fill="currentColor"/></symbol>
  <symbol id="i-check" viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-dot" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.5" fill="currentColor"/></symbol>
  <symbol id="i-full" viewBox="0 0 16 16"><path d="M3 7V3h4M13 9v4H9M3 3l4 4M13 13L9 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <symbol id="i-coll" viewBox="0 0 16 16"><path d="M3 8h8M8 5l3 3-3 3M13 3v10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>
<h1 class="doc" id="title">Decode tab in the app layout: empty, level A playing, level B analysing, level B result</h1>
<div class="frames" id="frames"></div>
<script>
const icon = (id, cls = 'ico', extra = '') => `<svg class="${cls}" ${extra}><use href="#${id}"/></svg>`;
const q = new URLSearchParams(location.search), phone = !!q.get('phone'), only = q.get('only');
if (phone) document.body.classList.add('phone');

const header = () => `<header class="bar"><div class="brand"><div class="logo"><span class="script">coding</span><span class="chrome">MISK</span><span class="eq">${[6, 10, 4, 8, 12, 5, 9, 7].map(h => `<i style="height:${h}px"></i>`).join('')}</span></div><small>SYNTH LAB FOR STRUDEL</small></div>
  <div class="transport"><div class="langs"><span class="on">NEON</span><span>HW</span><span>LIGHT</span></div><div class="langs"><span>IT</span><span class="on">EN</span></div><span class="btn icon">⚙</span></div></header>`;

// the shared stage: the app's visual with the HUD; the code over it only with Code over on (off here, as by default)
const inst = (label, svg, color) => `<div class="inst" style="color:${color}">${svg}<span>${label}</span></div>`;
const RIG = [
  inst('HATS', '<svg width="70" height="150" viewBox="0 0 70 150"><ellipse cx="35" cy="30" rx="30" ry="6" fill="none" stroke="currentColor" stroke-width="3"/><ellipse cx="35" cy="40" rx="30" ry="6" fill="none" stroke="currentColor" stroke-width="3"/><path d="M35 46v100" stroke="currentColor" stroke-width="2"/></svg>', '#ff8ac0'),
  inst('KICK', '<svg width="130" height="150" viewBox="0 0 130 150"><circle cx="65" cy="80" r="58" fill="rgba(255,79,163,.35)" stroke="currentColor" stroke-width="4"/><circle cx="65" cy="80" r="30" fill="none" stroke="currentColor" stroke-width="3" opacity=".7"/></svg>', '#ff4fa3'),
  inst('SNARE', '<svg width="80" height="150" viewBox="0 0 80 150"><ellipse cx="40" cy="70" rx="34" ry="8" fill="none" stroke="currentColor" stroke-width="3"/><path d="M6 70v18c0 5 15 9 34 9s34-4 34-9V70M40 97v50" fill="none" stroke="currentColor" stroke-width="3"/></svg>', '#7ce7ff'),
  inst('BASS', '<svg width="110" height="190" viewBox="0 0 110 190"><rect x="4" y="4" width="102" height="182" rx="6" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="55" cy="60" r="32" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="55" cy="60" r="10" fill="currentColor" opacity=".6"/><circle cx="55" cy="135" r="32" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="55" cy="135" r="10" fill="currentColor" opacity=".6"/></svg>', '#00e5ff'),
  inst('GUITAR', '<svg width="120" height="190" viewBox="0 0 120 190"><rect x="40" y="20" width="76" height="166" rx="6" fill="none" stroke="#ffb347" stroke-width="3"/><circle cx="60" cy="110" r="16" fill="none" stroke="#ffb347" stroke-width="3"/><circle cx="96" cy="110" r="16" fill="none" stroke="#ffb347" stroke-width="3"/><circle cx="60" cy="155" r="16" fill="none" stroke="#ffb347" stroke-width="3"/><circle cx="96" cy="155" r="16" fill="none" stroke="#ffb347" stroke-width="3"/><path d="M8 4l18 100" stroke="currentColor" stroke-width="5"/><path d="M6 110c-6 20 4 40 24 40s30-20 20-40-34-20-44 0z" fill="rgba(255,79,163,.4)" stroke="currentColor" stroke-width="4"/></svg>', '#ff4fa3'),
  inst('PAD · ARP', '<svg width="230" height="150" viewBox="0 0 230 150"><rect x="20" y="4" width="190" height="34" rx="4" fill="none" stroke="#7ce7ff" stroke-width="3"/>' + [0, 1, 2, 3, 4, 5, 6, 7].map(i => `<circle cx="${40 + i * 22}" cy="21" r="6" fill="#7ce7ff" opacity=".7"/>`).join('') + '<rect x="4" y="60" width="222" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="3"/>' + Array.from({ length: 14 }, (_, i) => `<rect x="${12 + i * 15.5}" y="68" width="11" height="28" fill="currentColor" opacity=".45"/>`).join('') + '<path d="M40 104l-20 44M190 104l20 44M60 104l55 44 55-44" stroke="currentColor" stroke-width="3" fill="none"/></svg>', '#ff4fa3'),
  inst('HOOK', '<svg width="130" height="170" viewBox="0 0 130 170"><rect x="4" y="4" width="122" height="140" rx="6" fill="none" stroke="currentColor" stroke-width="4"/><rect x="18" y="16" width="94" height="60" fill="rgba(61,255,176,.15)" stroke="currentColor" stroke-width="2"/><circle cx="30" cy="108" r="12" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="65" cy="108" r="12" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="100" cy="108" r="12" fill="none" stroke="currentColor" stroke-width="3"/></svg>', '#ffb347'),
  inst('FX', '<svg width="100" height="140" viewBox="0 0 100 140"><rect x="4" y="4" width="92" height="96" rx="4" fill="none" stroke="currentColor" stroke-width="4"/>' + [0, 1, 2].map(r => [0, 1, 2].map(c => `<rect x="${16 + c * 26}" y="${16 + r * 26}" width="18" height="18" fill="currentColor" opacity="${(r + c) % 2 ? .3 : .7}"/>`).join('')).join('') + '<path d="M50 100v38" stroke="currentColor" stroke-width="3"/></svg>', '#ff4fa3'),
  inst('RISER', '<svg width="70" height="210" viewBox="0 0 70 210"><ellipse cx="35" cy="14" rx="30" ry="8" fill="none" stroke="currentColor" stroke-width="3"/><path d="M28 22l-8 186M42 22l8 186M23 60h24M22 100h26M21 140h28M20 180h30" stroke="currentColor" stroke-width="2"/></svg>', '#7ce7ff'),
];
const stage = (state) => {
  const playing = state !== 'empty';
  const read = playing ? `124 BPM  ·  bar ${state === 'full' ? 61 : state === 'analysing' ? 33 : 23}\nNight Run · Some Band` : '124 BPM  ·  paused\nopen a track in Decode';
  const wave = playing ? 'M0 46 C 40 10, 80 80, 120 46 S 200 12, 240 46 S 320 80, 360 46 S 440 18, 480 46 S 560 74, 600 46 S 680 22, 720 46 S 800 70, 840 46' : 'M0 46 H 840';
  return `<section class="stagewrap">
    <div class="scope"><svg viewBox="0 0 840 92" preserveAspectRatio="none"><path d="${wave}" fill="none" stroke="#00e5ff" stroke-width="2.5"/></svg></div>
    <div class="rigrow">${RIG.join('')}</div><div class="stagefloor"></div>
    <div class="readout">${read}</div>
    <div class="hud-right"><span class="chip">◀</span><span class="sel">Stage</span><span class="chip">▶</span><span class="sel">Normal</span><span class="chip">Code over</span><span class="chip">Fullscreen</span></div>
  </section>`;
};

const modesTabs = () => `<div class="modes"><div class="mode-btn on"><b>${icon('i-play', 'ico', 'style="width:11px;height:11px"')} LISTEN</b><small>compose · songs · decode · playlists · radio</small></div><div class="mode-btn"><b>GROOVE LAB</b><small>artists · styles · genres · sounds · patterns · guide · lessons</small></div></div>
  <nav class="tabs">${['Compose', 'Songs', 'Decode', 'Playlists', 'Radio'].map(t => `<span class="tab${t === 'Decode' ? ' on' : ''}">${t}</span>`).join('')}</nav>
  <div class="dhead"><h2>Track to code</h2><p>Open a track: it plays as it is, and its code is written in the code panel.</p><span class="help">?</span></div>`;

function emptyPanel() {
  const rec = [['Night Run', 'Some Band', '3:21', 'Full ready', true, true], ['Glass Harbour', 'A. Nother', '4:05', 'Live only', false, true], ['demo-take-03', 'no artist', '2:12', 'Full ready', true, false]];
  return `<div class="drop">${icon('i-drop', 'big')}<h3>Drop an audio or video file here</h3><div><span class="btn fill">${icon('i-file')} Choose a file</span></div>
      <div class="fmts">MP3 · WAV · FLAC · M4A/AAC · OGG/Opus · video (sound only)</div>
      <p class="note">Up to 10 minutes, one file at a time. The file stays on this device: only its analysis and code are kept.</p></div>
    <div class="lbl">Recent tracks</div>
    ${rec.map(r => `<div class="rrow"><span class="thumb">${icon('i-wave')}</span><span><b>${r[0]}</b><small>${r[1]}</small></span><span class="len muted" style="font:12px var(--mono)">${r[2]}</span><span class="badge${r[4] ? ' ok' : ''}">${r[3]}</span><span style="display:flex;gap:6px"><span class="btn">${r[5] ? icon('i-play') + ' Open' : icon('i-file') + ' Pick again'}</span><span class="btn icon">${icon('i-x')}</span></span></div>`).join('')}`;
}

const trk = (cls, ico, name, sub, level, m, s, by) => `<div class="trk ${cls}${m ? ' silent' : ''}"><span class="ti">${icon(ico)}</span><span class="nm">${name}<small>${sub}</small></span><span class="meter"><i style="width:${level}%"></i></span><span class="ms"><span class="mini${by ? ' by' : ''}${m ? ' on' : ''}">M</span><span class="mini${s ? ' on' : ''}">S</span></span></div>`;
function trackPanel(state) {
  const full = state === 'full', anal = state === 'analysing';
  const level = `<div class="ctl"><span class="lbl">Level</span><span class="seg"><span class="${full ? '' : 'on'}"><small>A</small> Live</span><span class="${full ? 'on' : ''}">${anal ? icon('i-grow', 'ico', 'style="color:var(--a1)"') : ''}<small>B</small> Full</span></span></div>`;
  const ahead = full ? '' : `<div class="ctl"><span class="lbl">Look ahead</span><span class="sel" title="Off, 2 s, 4 s, 2 bars, 4 bars">2 bars</span></div>`;
  const sounds = `<div class="ctl"><span class="lbl">Sounds</span><span class="chips"><span class="chip" aria-pressed="true">Our sounds</span><span class="chip">Simple kit</span></span></div>`;
  const grow = anal ? `<div class="card growcard"><div class="gh">${icon('i-grow')}<div><h3>Analysing the whole track</h3><p class="note">The original keeps playing with the live code; the full code takes over at a bar when it is ready.</p></div></div>
      <div class="pbarx"><i></i></div><ul class="steps"><li class="done">${icon('i-check')} Tempo and beats: 124 BPM</li><li class="done">${icon('i-check')} Key: A minor</li><li class="now">${icon('i-dot')} Chords on the beats · 62 %</li><li class="todo">${icon('i-dot')} Sections, variations, ending</li><li class="todo">${icon('i-dot')} Sounds by measure</li></ul><div><span class="btn">Cancel</span></div></div>` : '';
  const rows = full
    ? [trk('orig', 'i-wave', 'Original', 'your file', 64), trk('', 'i-drum', 'Drums', '3 lines', 58), trk('', 'i-bass', 'Bass', 'sawtooth', 50), trk('', 'i-chord', 'Chords', 'Am F C G', 44, true), trk('', 'i-lead', 'Other', 'lead line', 30)]
    : [trk('orig', 'i-wave', 'Original', 'your file', 66), trk('', 'i-code', 'Code', '4 lines, live', 0, true, false, true)];
  const knob = full ? 50 : 0;
  const sect = full ? `<div class="ctl"><span class="lbl">Sections of the original</span><div class="strip">${[['Intro', 8, '#2a1846'], ['Verse', 16, '#3a1f5c'], ['Build', 8, '#5a2470'], ['Drop', 16, '#ff4fa3'], ['Break', 8, '#2a1846'], ['Drop', 16, '#ff4fa3'], ['Outro', 8, '#2a1846']].map(([n, b, c]) => `<span style="flex:${b};background:${c}">${n}</span>`).join('')}<i class="pl" style="left:57%"></i></div></div>` : '';
  return `<div class="card dpanel">
      <div class="filerow"><span class="fname">${icon('i-file')} night-run.mp3 · 3:21</span><span class="btn">Another file</span></div>
      <div class="grid2"><label class="field"><span class="lbl">Title</span><input value="Night Run"></label><label class="field"><span class="lbl">Artist</span><input value="Some Band"></label><span class="toggle" title="Names the original as a cover in the code and in the texts for sharing"><span class="sw"></span>Attribution</span></div>
      <div class="ctls"><div class="ctl"><span class="lbl">Tempo · key</span><span class="tempo" title="Space bar: tap the tempo">${icon('i-tap')}<b>124</b> BPM <span class="x">½×</span><span class="x">2×</span><span class="muted">A minor</span></span></div>${level}${ahead}${sounds}</div>
      <span class="fold">${icon('i-chev')} Options <span class="muted">· comments, technical functions, code view</span></span>
      <div class="acts"><span class="btn">${icon('i-export')} Export</span><span class="btn primary">${icon('i-open')} Open in Compose</span></div>
    </div>
    ${grow}
    <div class="card dpanel"><div class="lbl">Tracks</div><div class="tracks">${rows.join('')}</div>
      <div class="xf"><div class="ends"><span class="${knob < 50 ? 'on' : ''}">Original</span><span class="${knob > 50 ? 'on' : ''}">Code</span></div><div class="rail"><span class="mid"></span><span class="knob" style="left:${knob}%"></span></div>
      <p class="note">${full ? 'Both heard. Chords muted by you: the slider leaves it muted.' : 'Fully on Original: the code is muted by the slider. Drag it to hear both.'}</p></div>
      <div class="legend"><span class="mini by on">M</span> muted by the slider <span class="mini on">M</span> muted by you</div>${sect}</div>`;
}

// the code column: the generated code types here, like Compose
const tok = (c, s) => `<span class="${c}">${s}</span>`;
const S = s => tok('s', `"${s}"`), F = s => tok('f', s), K = s => tok('k', s), N = s => tok('n', s);
const LIVE = [
  ['cm', '// coding-misk · cover of "Night Run" by Some Band'],
  ['', `${F('setcpm')}(${N('124')}/${N('4')})`], ['', ''],
  ['', `${K('$:')} ${F('s')}("<span class="lit">bd</span>*4").${F('bank')}(${S('RolandTR909')})`],
  ['', `${K('$:')} ${F('s')}("~ <span class="lit">cp</span> ~ cp").${F('bank')}(${S('RolandTR909')}).${F('room')}(${N('.2')})`],
  ['', `${K('$:')} ${F('s')}("[~ <span class="lit">hh</span>]*4").${F('bank')}(${S('RolandTR909')}).${F('gain')}(${N('.6')})`],
  ['edit', `${K('$:')} ${F('note')}("&lt;a1 [f1@3 g1] c2<span class="caret"></span>`], ['', ''],
  ['cm', '// vox: …'],
];
const FULL = [
  ['cm', '// coding-misk · cover of "Night Run" by Some Band'],
  ['', `${F('setcpm')}(${N('124')}/${N('4')})`], ['', ''],
  ['', `${K('$:')} ${F('s')}("<span class="lit">bd</span>*4").${F('bank')}(${S('RolandTR808')}).${F('lpf')}(${N('900')})`],
  ['mutedl', `${K('_$:')} ${F('s')}("~ cp ~ cp").${F('bank')}(${S('RolandTR808')})`],
  ['', `${K('$:')} ${F('s')}("[~ <span class="lit">hh</span>]*4").${F('bank')}(${S('RolandTR808')}).${F('gain')}(${N('.5')})`],
  ['', `${K('$:')} ${F('note')}("&lt;<span class="lit">a1</span>!2 f1 g1&gt;").${F('struct')}("x ~ x x ~ x ~ x")`],
  ['', `  .${F('s')}(${S('sawtooth')}).${F('lpf')}(${N('600')})`],
  ['edit', `${K('$:')} ${F('chord')}("&lt;Am F C G&gt;").${F('voicing')}().${F('s')}(${S('supersaw')})<span class="caret"></span>`],
  ['', `${K('$:')} ${F('note')}("&lt;e4 [d4 c4] a3 ~&gt;").${F('s')}(${S('triangle')}).${F('delay')}(${N('.3')})`], ['', ''],
  ['cm', '// vox: …'],
];
function codecol(state) {
  const lines = state === 'full' ? FULL : state === 'empty' ? null : LIVE;
  const src = state === 'empty' ? 'Decode: no track' : `Decode: Night Run · ${state === 'full' ? 'Full' : 'Live'}`;
  const body = lines ? lines.map(([k, h], i) => `<div class="ln ${k}"><span class="no">${i + 1}</span><span class="t">${h || ' '}</span></div>`).join('') : '<p class="empty-code">The code of the track appears here while it plays.</p>';
  return `<aside class="codecol"><div class="codehead"><div><div class="lbl">Live code</div><div class="src">${src}</div></div><div class="code-tools"><span class="btn icon">${icon('i-full')}</span><span class="btn icon">${icon('i-coll')}</span></div></div>
    <div class="edhost">${body}</div><div class="hidden-code">${icon('i-chev')} Hidden code</div>
    <div class="acts"><span class="btn primary">Open in strudel.cc ${icon('i-open')}</span><span class="btn">Copy code</span></div>
    <p class="note"><span class="kbd">Ctrl</span>/<span class="kbd">⌘</span>+<span class="kbd">Enter</span> plays or updates from anywhere on the page. <span class="kbd">Ctrl</span>+<span class="kbd">.</span> stops.</p></aside>`;
}

const pbar = (state) => {
  const playing = state !== 'empty';
  const pos = { live: 22, analysing: 31, full: 58 }[state] || 0;
  const info = { live: 'bar 23 / 104 · 0:42 / 3:21', analysing: 'bar 33 / 104 · 1:02 / 3:21', full: 'bar 61 / 104 · 1:56 / 3:21' }[state] || '';
  return `<footer class="pbar"><span class="pb-btn dis">${icon('i-prev')}</span><span class="play">${icon(playing ? 'i-pause' : 'i-play')} ${playing ? 'PAUSE' : 'PLAY'}</span><span class="pb-btn">${icon('i-stop')}</span><span class="pb-btn dis">${icon('i-next')}</span>
    <span class="pb-btn dis pb-mode">${icon('i-shuf')}</span><span class="pb-btn dis pb-mode">${icon('i-rep')}</span>
    <div class="pb-mid"><div class="pb-now"><span>${playing ? 'Night Run · Some Band' : ''}</span><small>${info}</small></div><div class="seek"><i style="width:${pos}%"></i></div></div>
    <div class="vol"><span class="pb-btn">${icon('i-spk')}</span><span class="rl"></span></div></footer>`;
};

function frame(state) {
  const label = { empty: '1 · empty', live: '2 · level A playing', analysing: '3 · level B analysing', full: '4 · level B result' }[state] + (phone ? ' · 400 px' : '');
  const left = `<div>${modesTabs()}${state === 'empty' ? `<div class="dpanel">${emptyPanel()}</div>` : `<div class="dpanel">${trackPanel(state)}</div>`}</div>`;
  return `<section class="frame"><span class="flabel">${label}</span>${header()}${stage(state)}<div class="work">${left}${codecol(state)}</div>${pbar(state)}</section>`;
}
const states = ['empty', 'live', 'analysing', 'full'].filter(s => !only || s === only);
document.getElementById('frames').innerHTML = states.map(frame).join('');
if (only) document.getElementById('title').remove();
</script>
</body>
</html>
