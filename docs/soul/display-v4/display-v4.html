<style>

<script>(() => {
// Song soul (#46): the data the soul views draw, from a song alone (Compose, Songs, playlists, the radio's
// lead song) or from a radio song with its plan (the director's targets and curves). Pure: same song, same soul.





const list = v => (v === undefined ? [] : Array.isArray(v) ? v : [v]);
const clamp = (x, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, x));

// FNV-1a of the seed: the song's signature, and the base of every seeded shape
function seedHash(seed) {
  let h = 2166136261;
  for (const ch of String(seed)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
// a seeded number 0..1 from the song's hash and any integers
const hashOf = (hash, ...xs) => {
  let h = (hash ^ 0x9e3779b9) >>> 0;
  for (const x of xs) { h = Math.imul(h ^ (x | 0), 2654435761); h ^= h >>> 15; h = Math.imul(h, 2246822507); h ^= h >>> 13; }
  return (h >>> 0) / 4294967296;
};
// an event of `dur` seconds somewhere in each slot of `period` seconds, with probability p: { k: 0..1, st, r, r2, slot } or null
const eventAt = (hash, t, salt, period, dur, p) => {
  const slot = Math.floor(t / period), st = slot * period + hashOf(hash, salt, slot, 1) * (period - dur), k = (t - st) / dur;
  return hashOf(hash, salt, slot, 2) < p && k >= 0 && k <= 1 ? { k, st, r: hashOf(hash, salt, slot, 3), r2: hashOf(hash, salt, slot, 4), slot } : null;
};

const kindOf = s => (s.add !== undefined ? 'add' : s.remove !== undefined ? 'remove' : s.set ? 'set' : s.pattern ? 'pattern' : s.rack ? 'rack' : 'other');
const stepsOf = song => buildSteps(song).map(s => ({ at: s.at, add: s.add, remove: s.remove, kind: kindOf(s), say: s.say ? sayText(s.say, 'en') : undefined }));

// a song measured part by part (its sections): what plays at the middle of each, with the same measures as the radio
function measured(song) {
  const abs = absoluteClips(song), secs = abs.sections || [];
  const tracks = abs.tracks.filter(t => t.type !== 'voice');
  const max = Math.max(1, tracks.filter(t => t.type !== 'riser').length);
  const talk = (song.build || []).some(s => s.say) ? 0.6 : 0.2;
  // parts: the sections, or phrases of 8 bars (at most 16) for songs of few sections (a live build in one section)
  const total = secs.reduce((a, s) => a + s.bars, 0), chunk = Math.max(8, Math.ceil(total / 16 / 8) * 8);
  const segs = secs.length >= 4 || total < 16 ? secs : Array.from({ length: Math.ceil(total / chunk) }, (_, i) => {
    let a = 0; const sec = secs.find(s => (a += s.bars) > i * chunk) || secs[secs.length - 1];
    return { name: sec.name, bars: Math.min(chunk, total - i * chunk) };
  });
  let at = 0;
  const parts = segs.map(sec => {
    const mid = at + Math.floor(sec.bars / 2), st = stateAt(abs, mid).song;
    const on = st.tracks.map(t => {
      if (t.type === 'voice') return t;
      const c = (t.clips || []).find(c => mid >= c.start && mid < c.start + c.bars);
      return c && !t.mute ? { ...t, settings: { ...t.settings, ...(c.set || {}) } } : { ...t, mute: true };
    });
    const state = { tracks: on }, m = curveParts(state), says = (song.build || []).filter(s => s.say && s.at >= at && s.at < at + sec.bars).length;
    at += sec.bars;
    return { role: String(sec.name || 'part').toLowerCase(), energy: clamp(energyOf(state)), ...m, voice: says ? clamp(talk + 0.1 * says) : talk * 0.5 };
  });
  // steps for the views: the song's live build, or tracks coming in and out at the section starts
  let steps = stepsOf(song);
  if (!steps.length) {
    let prev = new Set();
    at = 0;
    secs.forEach(sec => {
      const now = new Set(tracks.filter(t => (t.clips || []).some(c => c.start < at + sec.bars && c.start + c.bars > at)).map(t => t.id));
      const add = [...now].filter(id => !prev.has(id)), remove = [...prev].filter(id => !now.has(id));
      if (add.length) steps.push({ at, add, kind: 'add' });
      if (remove.length) steps.push({ at, remove, kind: 'remove' });
      prev = now; at += sec.bars;
    });
  }
  return { parts, max, tracks, steps };
}

// The soul of a song. ctx (radio songs): { plan, entry, opts } from the director.
// Out: what the views read (the shape of the v3 mockups' song files), plus the hash and signature.
function soulData(song, ctx = {}) {
  const { plan, entry = {}, opts = {} } = ctx, secs = song.sections || [], first = secs[0] || {};
  const bars = secs.reduce((a, s) => a + s.bars, 0);
  const seed = String(song.seed || (ctx.seed && `${ctx.seed}-${ctx.n ?? 0}`) || song.id || song.title || 'soul');
  const base = { seed, title: song.title || 'Untitled', key: entry.key || first.key || song.key || 'A', bpm: Math.round(entry.bpm || first.bpm || song.bpm || 120), meter: entry.meter || first.meter || '4/4', bars };
  let out;
  if (plan && plan.plan) {
    const C = songCurves(song, plan, opts), val = (c, k) => c.set[k] ?? c.measured[k];
    out = {
      ...base, shape: entry.shape || 'free', phrase: plan.phrase, bars: plan.bars, styles: entry.styles || [],
      opts: { chaos: opts.chaos ?? 0.5, energy: opts.energy ?? 0.5, complexity: opts.complexity ?? 0.5, talk: opts.talk ?? 0.5 },
      roles: plan.plan.map(d => d.role), energy: plan.plan.map(d => d.target), max: densityMax(plan),
      density: C.map(c => val(c, 'density')), brightness: C.map(c => val(c, 'brightness')), tension: C.map(c => val(c, 'tension')), voice: C.map(c => val(c, 'voice')),
      tracks: song.tracks.filter(t => t.type !== 'voice').map(t => ({ id: t.id, type: t.type, name: t.name || t.id })),
      steps: stepsOf(song), speaker: entry.voice || null,
    };
  } else {
    const m = measured(song), P = m.parts.length ? m.parts : [{ role: 'part', energy: 0.5, density: 1, brightness: 0.5, tension: 0.3, voice: 0.2 }];
    const avg = k => P.reduce((a, p) => a + p[k], 0) / P.length;
    const h = seedHash(seed);
    const tags = song.tags || {};
    out = {
      ...base, shape: entry.lead ? 'lead' : secs.length > 1 ? 'scenes' : 'loop', phrase: 8, styles: tags.styles || (song.style ? [song.style] : []),
      opts: { chaos: Math.round(hashOf(h, 5) * 100) / 100, energy: Math.round(avg('energy') * 100) / 100, complexity: Math.round(avg('density') / m.max * 100) / 100, talk: Math.round(avg('voice') * 100) / 100 },
      roles: P.map(p => p.role), energy: P.map(p => p.energy), max: m.max,
      density: P.map(p => p.density), brightness: P.map(p => p.brightness), tension: P.map(p => p.tension), voice: P.map(p => p.voice),
      tracks: m.tracks.map(t => ({ id: t.id, type: t.type, name: t.name || t.id })), steps: m.steps, speaker: null,
    };
  }
  const hash = seedHash(out.seed);
  return { ...out, hash, hex: hash.toString(16).toUpperCase().padStart(8, '0') };
}

// the curves the views read, all 0..1 (density over the song's most)
const soulCurves = D => ({ energy: D.energy, density: D.density.map(x => x / Math.max(1, D.max)), brightness: D.brightness, tension: D.tension, voice: D.voice });

// is a track playing at a bar (from the steps)
function trackOn(D, id, bar) {
  let on = !D.steps.some(s => list(s.add).includes(id));
  for (const s of D.steps) { if (s.at > bar) break; if (list(s.add).includes(id)) on = true; if (list(s.remove).includes(id)) on = false; }
  return on;
}

// the views, their default per song (from the seed) and the lines of the overlays (English, the screens' language)
const VIEWS = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', 'j'];
const VIEW_NAMES = { a: 'Tracker', b: 'Terrain', c: 'Sphere', d: 'Lattice', e: 'Strands', f: 'Landscape', g: 'Particles', h: 'Halftone', i: 'Aura', j: 'Spectrum' };
const CRT_VIEWS = ['a', 'b', 'c'];
const defaultView = D => VIEWS[Math.floor(hashOf(D.hash, 1) * VIEWS.length)];
const PHRASES = ['ANALYZING SONG SOUL', 'TUNING IN', 'DISSECTING THE GROOVE', 'SEEING ITS INSIDES', 'READING THE SEED', 'MAPPING THE ENERGY', 'DECODING THE PULSE', 'LISTENING TO THE BONES', 'CALIBRATING THE SPECTRUM', 'TRACING THE HOOK', 'COUNTING THE BARS', 'WAKING THE DIRECTOR',

    s += `<g transform="translate(${bx},${top + plugL}) scale(1,-1) translate(${-bx},${-(top + plugL)})">${plug(bx, top + plugL, true, c >= 1)}</g>`;

    if (!hw && sp && t >= sp.at && t - sp.at < .45) { const k = (t - sp.at) / .45; for (let i = 0; i < 14; i++) { const a = i / 14 * 6.283 + i; s += `<circle cx="${sx + Math.cos(a) * (6 + k * 30)}" cy="${top + Math.sin(a) * (6 + k * 30)}" r="${2 * (1 - k)}" fill="#fff" opacity="${1 - k}"/>`; } }
  }
  cableSvg.innerHTML = s;
}

// ---------- stage frames, or the soul when overridden ----------
const frames = { neon: [], hw: [] };
for (const th of ['neon', 'hw']) for (let i = 0; i < 16; i++) { const im = new Image(); im.src = `../display-v1/assets/${th}-stage-${String(i).padStart(2, '0')}.jpg`; frames[th].push(im); }
const stagecv = $('#stagecv'), sg = stagecv.getContext('2d'), amb = document.createElement('canvas'); amb.width = 48; amb.height = 30; const ag = amb.getContext('2d');

  const fr = frames[ui], n = fr.length, i = Math.floor(t * 11) % (2 * n - 2), im = fr[i < n ? i : 2 * n - 2 - i];
  if (ss < 1 && im.complete && im.naturalWidth) { const s = Math.max(w / im.naturalWidth, h / im.naturalHeight); sg.drawImage(im, (w - im.naturalWidth * s) / 2, (h - im.naturalHeight * s) / 2, im.naturalWidth * s, im.naturalHeight * s); }
  if (ss > 0 && soulCache) {

    sg.save(); ag.filter = 'blur(2px)'; ag.drawImage(src, -4, -3, 56, 36); ag.filter = 'none';
    sg.globalAlpha = ss * .4; sg.drawImage(amb, 0, 0, w, h); sg.globalAlpha = ss; sg.fillStyle = 'rgba(0,0,0,.35)'; sg.fillRect(0, 0, w, h); sg.drawImage(src, (w - dw) / 2, (h - dh) / 2, dw, dh);
    if (ss < 1) for (let k = 0; k < 10; k++) { const y = Math.random() * h, hh = 4 + Math.random() * 26; sg.drawImage(stagecv, 0, y, w, hh, (Math.random() - .5) * 60 * (1 - ss), y, w, hh); }
    sg.restore();
  }
}

// ---------- frame ----------
function frame() {
  const t = now(), shrink = valAt('shrink', t), doors = valAt('doors', t), out = valAt('out', t), ss = valAt('stageSoul', t);
  const rowH = 378 + 92 * shrink, bayW = 540, gap = 18;
  $('#row').style.height = rowH + 'px'; $('#below').style.top = (124 + rowH + 16) + 'px';
  $('#stage').style.width = (1408 - (bayW + gap) * shrink) + 'px';
  $('#bay').style.opacity = clamp(shrink * 1.6); $('#bay').style.transform = `translateX(${(1 - eout(shrink)) * 120}px)`;
  $('#doorT').style.transform = `translateY(${-doors * 101}%)`; $('#doorB').style.transform = `translateY(${doors * 101}%)`; $('#lamp').style.opacity = valAt('lamp', t);
  const want = lastMark(marks.shell, t, { v: S.shell }).v; if (want !== shownShell) mountShell(want);
  const disp = $('#mount .display');
  if (disp) { disp.style.transform = `translate3d(0, ${24 * (1 - out)}px, ${-520 * (1 - out)}px) rotateX(${(1 - out) * 8}deg) scale(.97)`; disp.style.filter = `brightness(${.25 + .75 * clamp(out)})`; disp.style.visibility = doors > .05 || out > .01 ? 'visible' : 'hidden'; }
  // the screw: turns, then pops out and drops
  const turn = valAt('screw', t), so = valAt('screwOut', t);
  $('#slot').setAttribute('transform', `rotate(${turn})`);
  $('#screw').style.transform = so > 0 ? `translate(${so * 10}px, ${so * so * 70}px) rotate(${so * 200}deg) scale(${1 + Math.sin(so * Math.PI) * .4})` : `scale(${1 + Math.min(1, turn / 390) * .25})`;
  $('#screw').style.opacity = 1 - clamp((so - .6) / .4);
  syncPanel(t);
  const needD = valAt('screen', t) > 0 || phaseOf('screen', t).k < 1;
  if ((needD || ss > 0) && (fixedT !== null || t - lastSoul > 1 / 30 || lastSoul > t)) { lastSoul = t; const st = $('#stage').getBoundingClientRect(); soulCache = soulFrame(t, ss > 0 ? Math.min(st.width / 1200, st.height / 760) * 1.5 : .7); }
  drawScreen(t); drawStage(t, ss); drawSel(t); drawCable(t); drawCursor(t);
  requestAnimationFrame(frame);
}

// ---------- demo script with a visible cursor ----------
const caps = []; window.CAPS = caps;
function cursorTo(at, sel, dur = .6) { marks.cursor.push({ at, sel, dur }); }
function drawCursor(t) {
  const cur = $('#cursor'), list = marks.cursor.filter(m => m.at <= t);
  if (!list.length) { cur.style.display = 'none'; return; }
  const m = list[list.length - 1], prev = list[list.length - 2], pos = sel => { const el = typeof sel === 'string' ? $(sel) : null; if (!el) return null; const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
  const to = pos(m.sel) || [1300, 860], from = prev ? pos(prev.sel) || to : [1100, 700], k = eio(clamp((t - m.at) / m.dur));
  cur.style.display = 'block'; cur.style.transform = `translate(${from[0] + (to[0] - from[0]) * k - 2}px, ${from[1] + (to[1] - from[1]) * k - 1}px)`;
  const cl = marks.click.concat(marks.cursor.filter(x => x.click)).filter(x => x.at <= t && t - x.at < .3).pop();
  $('#cring').setAttribute('r', cl ? 3 + (t - cl.at) * 40 : 0); $('#cring').setAttribute('opacity', cl ? 1 - (t - cl.at) / .3 : 0);
}
function demo(at = now() + .5) {
  let t = at;
  const say = (txt, d = 2.6) => caps.push({ at: t, txt, d }), click = (sel, fn, move = .7) => { cursorTo(t, sel, move); t += move + .1; marks.cursor.push({ at: t, sel, dur: .01, click: true }); fn(t); };
  say('Hidden: a small screw in the corner of the stage. Unscrew it…', 3.4); t += .4;
  click('#screw', x => turnScrew(x)); t += .45; click('#screw', x => turnScrew(x), .15); t += .45; click('#screw', x => turnScrew(x), .15);
  say('…the hatch opens and the display comes out', 3); t += 3.3;
  click('#mount [data-act="next"]', x => stepView(x, 1)); say('The display\'s own keys: view, lock, override, full screen'); t += 1.6;
  click('#mount [data-act="lock"]', x => toggleLock(x)); t += 1.2;
  click('#mount [data-act="override"]', x => overrideOn(x)); say('Override: the SCART cable runs from under the display to the stage\'s socket', 3.4); t += 3.6;
  click('#mount [data-act="override"]', x => overrideOff(x)); t += 1.6;
  for (let i = 0; i < 3; i++) { click('#sel [data-sel="snext"]', x => changeShell(x, 1), i ? .3 : .7); say(`Shell ▶: ${BYID[S.shell].name}`, 3); t += 3.4; }
  click('#sel [data-sel="sprev"]', x => changeShell(x, -1)); say(`Shell ◀: ${BYID[S.shell].name}`, 3); t += 3.4;
  click('#mount [data-act="override"]', x => overrideOn(x)); say('Override with another shell', 3); t += 3.4; click('#mount [data-act="override"]', x => overrideOff(x)); t += 1.4;
  click('#mount [data-act="power"]', x => powerOff(x)); say('Power off: back into the bay, and the screw goes back in', 3.6); t += 4.2;
  caps.push({ at: t, txt: '', d: .1 }); cursorTo(t, null, .8); window.DEMO_END = t + .8;
}
setInterval(() => { const t = now(), c = [...caps].reverse().find(x => x.at <= t); const el = $('#caption'); if (c && t - c.at < c.d && c.txt) { el.textContent = c.txt; el.style.opacity = 1; } else el.style.opacity = 0; }, 60);

$('#top').src = `../display-v1/assets/${ui}-top.jpg`; $('#below').src = `../display-v1/assets/${ui}-below.jpg`;
if (Q.get('state') === 'open' || Q.get('state') === 'override') { go('screw', 390, -12, .01); go('screwOut', 1, -12, .01); powerOn(-10); if (Q.get('view')) { S.view = Q.get('view'); mark(marks.view, -10, { v: S.view }); } if (Q.get('state') === 'override') overrideOn(-5); }
