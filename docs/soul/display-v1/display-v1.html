<!doctype html>
<html><head><meta charset="utf-8">
<title>Soul display v1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&family=Space+Grotesk:wght@400;600&family=JetBrains+Mono:wght@400;600&family=Special+Elite&family=Michroma&family=Chakra+Petch:wght@500;700&display=swap">
<style>
:root { --bg: #0b0410; --line: #4a1f5c; --ink: #f2eaff; --a1: #fcee0a; --a2: #00f0ff; --m: #ff2a6d; }
:root[data-ui="hw"] { --bg: #141416; --line: #3d3d43; --ink: #e9e6de; --a1: #ffb347; --a2: #ffd27a; --m: #ff6a2a; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Space Grotesk", sans-serif; }
body { width: 1440px; height: 900px; position: relative; overflow: hidden; }
img.band { position: absolute; left: 0; display: block; }
#top { top: 0; }
.themehit { position: absolute; top: 18px; height: 36px; width: 50px; cursor: pointer; }

/* ---------- the stage row ---------- */
#row { position: absolute; left: 16px; top: 124px; width: 1408px; height: 378px; }
#stage { position: absolute; left: 0; top: 0; height: 100%; width: 1408px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: #000; }
:root[data-ui="hw"] #stage { border: 6px solid #0f0f11; border-radius: 6px; box-shadow: 0 0 0 1px #3d3d43, 0 6px 16px rgba(0,0,0,.6); }
#stage canvas { display: block; width: 100%; height: 100%; }
.hud { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; align-items: center; z-index: 3; }
.chip { font: 13px "Space Grotesk", sans-serif; color: var(--ink); background: rgba(0,0,0,.55); border: 1px solid color-mix(in srgb, var(--ink) 30%, transparent); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.chip .ar { color: var(--a1); margin-left: 6px; }
.chip.pw[aria-pressed="true"] { border-color: var(--a1); color: var(--a1); box-shadow: 0 0 10px color-mix(in srgb, var(--a1) 50%, transparent); }
:root[data-ui="hw"] .chip { border-radius: 4px; background: linear-gradient(#3b3b41, #28282d); border: 1px solid #0d0d10; box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 2px 0 #0d0d10; }
.socket { position: absolute; right: 10px; bottom: 12px; width: 34px; height: 22px; border-radius: 5px; background: linear-gradient(#1b1b20, #0b0b0e); border: 1px solid #44444c; box-shadow: inset 0 2px 4px #000; z-index: 3; opacity: 0; display: grid; place-items: center; }
.socket::before { content: ""; width: 16px; height: 8px; border-radius: 2px; background: #000; box-shadow: inset 0 0 0 1px #2a2a30; }
.socket i { position: absolute; top: -9px; right: 2px; width: 5px; height: 5px; border-radius: 50%; background: #333; }
.socket.live i { background: var(--a2); box-shadow: 0 0 8px var(--a2); }
.socket span { position: absolute; right: 40px; top: 4px; font: 9px "Share Tech Mono", monospace; letter-spacing: .12em; color: color-mix(in srgb, var(--ink) 55%, transparent); white-space: nowrap; }

/* ---------- the bay (hatch) ---------- */
#bay { position: absolute; right: 0; top: 0; width: 540px; height: 100%; opacity: 0; }
.rim { position: absolute; inset: 0; border-radius: 14px; background: linear-gradient(160deg, #1a0d24, #0a0510 60%, #12081b); border: 1px solid #3a1850;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.04), 0 0 18px rgba(0,240,255,.12); }
.rim::before { content: ""; position: absolute; inset: 6px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--a2) 70%, transparent); box-shadow: 0 0 12px color-mix(in srgb, var(--a2) 55%, transparent), inset 0 0 12px color-mix(in srgb, var(--a2) 30%, transparent); }
.rim::after { content: "SOUL BAY 01"; position: absolute; left: 22px; bottom: 9px; font: 9px "Share Tech Mono", monospace; letter-spacing: .3em; color: color-mix(in srgb, var(--a2) 80%, transparent); }
:root[data-ui="hw"] .rim { border-radius: 6px; background: repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px), linear-gradient(#34343a, #1f1f23); border: 1px solid #0b0b0d; box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 6px 16px rgba(0,0,0,.6); }
:root[data-ui="hw"] .rim::before { inset: 8px; border-radius: 3px; border: 3px solid transparent; box-shadow: inset 0 2px 6px #000;
  background: repeating-linear-gradient(-45deg, #e6b400 0 10px, #111 10px 20px) border-box; -webkit-mask: linear-gradient(#000 0 0) padding-box exclude, linear-gradient(#000 0 0); mask: linear-gradient(#000 0 0) padding-box exclude, linear-gradient(#000 0 0); }
:root[data-ui="hw"] .rim::after { color: #ffb347; }
.rivet { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #9a9aa2, #3a3a40 70%); box-shadow: 0 1px 1px #000; opacity: 0; }
:root[data-ui="hw"] .rivet { opacity: 1; }
.well { position: absolute; left: 14px; top: 14px; right: 50px; bottom: 26px; border-radius: 8px; overflow: hidden; background: radial-gradient(ellipse at 50% 55%, #1c1030, #05020a 75%); box-shadow: inset 0 0 40px #000; perspective: 900px; perspective-origin: 50% 45%; }
:root[data-ui="hw"] .well { border-radius: 2px; background: radial-gradient(ellipse at 50% 55%, #2a2620, #060606 75%); }
/* tunnel lines that show the depth the display comes from */
.well::before { content: ""; position: absolute; inset: 0; background:
  linear-gradient(transparent 49.6%, color-mix(in srgb, var(--a2) 22%, transparent) 50%, transparent 50.4%),
  repeating-linear-gradient(90deg, transparent 0 39px, color-mix(in srgb, var(--a2) 9%, transparent) 39px 40px); opacity: .7; }
.door { position: absolute; left: 0; right: 0; height: 50.5%; z-index: 5; background: linear-gradient(#170b22, #0d0616); }
.door.top { top: 0; border-bottom: 1px solid color-mix(in srgb, var(--a1) 80%, transparent); }
.door.bot { bottom: 0; border-top: 1px solid color-mix(in srgb, var(--a1) 80%, transparent); }
.door::before { content: ""; position: absolute; inset: 14px 18px; border: 1px solid rgba(255,255,255,.06); border-radius: 4px; background: repeating-linear-gradient(-45deg, transparent 0 14px, color-mix(in srgb, var(--a1) 10%, transparent) 14px 16px); }
.door.top::after, .door.bot::after { content: ""; position: absolute; left: 0; right: 0; height: 2px; background: var(--a1); box-shadow: 0 0 10px var(--a1); }
.door.top::after { bottom: 0; } .door.bot::after { top: 0; }
:root[data-ui="hw"] .door { background: repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 1px, transparent 1px 4px), linear-gradient(#3a3a40, #26262b); border-color: #000; }
:root[data-ui="hw"] .door::before { background: none; border: 1px solid rgba(0,0,0,.6); box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
:root[data-ui="hw"] .door.top::after, :root[data-ui="hw"] .door.bot::after { height: 10px; background: repeating-linear-gradient(-45deg, #e6b400 0 8px, #111 8px 16px); box-shadow: none; }
.mount { position: absolute; inset: 0; display: grid; place-items: center; transform-style: preserve-3d; }
.lamp-strip { position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: var(--a2); box-shadow: 0 0 18px 4px var(--a2); opacity: 0; z-index: 1; }
.mount { z-index: 2; }

/* shell lever on the bay's right edge */
.slever { position: absolute; right: 11px; top: 40px; width: 28px; bottom: 40px; cursor: pointer; z-index: 6; }
.slever .slot { position: absolute; left: 11px; top: 0; bottom: 0; width: 6px; border-radius: 3px; background: #000; box-shadow: inset 0 1px 3px #000, 0 0 0 1px rgba(255,255,255,.08); }
.slever .knob { position: absolute; left: 1px; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff8, transparent 40%), radial-gradient(circle at 50% 50%, var(--m), color-mix(in srgb, var(--m) 40%, #000)); box-shadow: 0 3px 6px #000, 0 0 12px color-mix(in srgb, var(--m) 60%, transparent); }
:root[data-ui="hw"] .slever .knob { background: radial-gradient(circle at 35% 30%, #fff6, transparent 40%), radial-gradient(#d43c1c, #5a1408); box-shadow: 0 3px 6px #000; }
.slever .stop { position: absolute; left: 30px; width: 0; font: 9px "Share Tech Mono", monospace; color: color-mix(in srgb, var(--ink) 50%, transparent); }
.slever .stop.on { color: var(--a1); text-shadow: 0 0 6px var(--a1); }
.slever .ttl { position: absolute; left: -2px; top: -26px; font: 9px "Share Tech Mono", monospace; letter-spacing: .2em; color: color-mix(in srgb, var(--ink) 60%, transparent); }

/* ---------- the display: shared ---------- */
.display { position: relative; transform-style: preserve-3d; will-change: transform, filter; }
.glass { position: relative; overflow: hidden; background: #000; }
.glass canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.glass .scan { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px); }
.glass .glare { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 80% at 20% 0%, rgba(255,255,255,.14), transparent 45%), radial-gradient(140% 110% at 50% 50%, transparent 60%, rgba(0,0,0,.55)); }
.display [data-act] { cursor: pointer; }
.port { position: absolute; width: 18px; height: 12px; border-radius: 3px; background: #050505; box-shadow: inset 0 0 0 2px #2a2a2a, 0 0 0 1px rgba(255,255,255,.15); }

/* A · MISK/OS 6000 (industrial sci-fi terminal) */
.sA { width: 440px; padding: 12px 14px 14px; border-radius: 10px 10px 14px 14px; background:
  linear-gradient(180deg, rgba(255,255,255,.35), transparent 8%, transparent 92%, rgba(0,0,0,.25)),
  linear-gradient(90deg, #b9b19c, #d3ccb8 12%, #d6cfbc 88%, #aea691); box-shadow: inset 0 0 0 1px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.5), 0 18px 40px rgba(0,0,0,.7); color: #1d1b17; }
.sA-top { display: flex; align-items: center; gap: 8px; height: 22px; padding: 0 4px; border-bottom: 2px solid #8f8876; margin-bottom: 9px; }
.sA-brand { font: 700 13px "Chakra Petch", sans-serif; letter-spacing: .12em; }
.sA-sub { font: 8px "Share Tech Mono", monospace; letter-spacing: .14em; color: #4d483d; flex: 1; }
.lamp { width: 9px; height: 9px; border-radius: 50%; box-shadow: inset 0 -1px 1px rgba(0,0,0,.5), 0 0 0 1px #5c5648; }
.lamp.a { background: #3d2a05; } .lamp.g { background: #133d10; } .lamp.r { background: #3d0f0a; }
.sA.on .lamp.a { background: #ffb21e; box-shadow: 0 0 8px #ffb21e, 0 0 0 1px #5c5648; } .sA.on .lamp.g { background: #5dff6a; box-shadow: 0 0 8px #5dff6a, 0 0 0 1px #5c5648; }
.sA.on .lamp.r.blink { background: #ff3b2a; box-shadow: 0 0 8px #ff3b2a, 0 0 0 1px #5c5648; }
.sA-body { display: flex; gap: 10px; align-items: stretch; }
.sA-vent { width: 14px; border-radius: 3px; background: repeating-linear-gradient(0deg, #2d2a24 0 3px, #9d9682 3px 7px); box-shadow: inset 0 0 0 1px #6f6957; }
.sA .bezelA { flex: 1; padding: 12px; border-radius: 16px; background: linear-gradient(#26241f, #121110); box-shadow: inset 0 2px 6px #000, 0 1px 0 rgba(255,255,255,.4); }
.sA .glass { height: 236px; border-radius: 12px / 16px; box-shadow: inset 0 0 30px rgba(0,0,0,.9); }
.sA-side { width: 26px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 4px 0; }
.sA-side .vtxt { writing-mode: vertical-rl; transform: rotate(180deg); font: 8px "Share Tech Mono", monospace; letter-spacing: .3em; color: #4d483d; }
.sA-side .dial { width: 22px; height: 22px; border-radius: 50%; background: conic-gradient(from 200deg, #3a362e, #8a8370, #3a362e); box-shadow: 0 2px 2px rgba(0,0,0,.4), inset 0 0 0 3px #b5ad98; }
.sA-keys { display: flex; gap: 7px; align-items: flex-end; margin-top: 11px; padding: 8px 6px 2px; border-top: 1px solid rgba(0,0,0,.25); }
.key { position: relative; width: 52px; height: 36px; border: 0; border-radius: 4px; padding: 0; font: 600 9px "Share Tech Mono", monospace; letter-spacing: .06em; color: #1d1b17;
  background: linear-gradient(#f1ecdf, #d7d0bd); box-shadow: inset 0 -3px 0 rgba(0,0,0,.18), inset 0 1px 0 #fff, 0 2px 0 #6f6957, 0 3px 4px rgba(0,0,0,.35); }
.key.k-o { background: linear-gradient(#f08a3c, #d0631d); color: #1a0d03; }
.key.k-g { background: linear-gradient(#9b968a, #7d786c); color: #f2eee4; }
.key.down { transform: translateY(2px); box-shadow: inset 0 -1px 0 rgba(0,0,0,.18), 0 0 0 #6f6957, 0 1px 2px rgba(0,0,0,.35); }
.key .led { position: absolute; top: 4px; right: 4px; width: 5px; height: 5px; border-radius: 50%; background: #3a2f12; }
.key.lit .led { background: #ffb21e; box-shadow: 0 0 6px #ffb21e; }
.tgl { position: relative; width: 70px; height: 46px; margin-left: auto; }
.tgl .plate { position: absolute; left: 14px; top: 0; width: 42px; height: 34px; border-radius: 4px; background: linear-gradient(#5b574c, #3a372f); box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 2px 3px rgba(0,0,0,.4); }
.tgl .bat { position: absolute; left: 31px; top: 4px; width: 8px; height: 22px; border-radius: 4px; background: linear-gradient(90deg, #8a8a8a, #f2f2f2, #8a8a8a); transform-origin: 50% 100%; box-shadow: 0 2px 3px rgba(0,0,0,.6); }
.tgl .guard { position: absolute; left: 12px; top: -6px; width: 46px; height: 30px; border-radius: 6px 6px 3px 3px; background: linear-gradient(rgba(220,40,30,.85), rgba(150,20,15,.85)); transform-origin: 50% 0; box-shadow: 0 3px 4px rgba(0,0,0,.4); }
.tgl label { position: absolute; left: 0; right: 0; bottom: -3px; text-align: center; font: 600 8px "Share Tech Mono", monospace; letter-spacing: .08em; color: #2a2620; }
.sA .port { left: 20px; bottom: -6px; }
.screw { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #e8e2d0, #77705e 70%); box-shadow: 0 1px 0 rgba(255,255,255,.4); }
.screw::after { content: ""; position: absolute; left: 1px; right: 1px; top: 3.5px; height: 1px; background: #4a4538; transform: rotate(35deg); }

/* B · field terminal (wasteland) */
.sB { width: 430px; padding: 16px 18px 16px; border-radius: 30px 30px 22px 22px; color: #e5dcc0;
  background: radial-gradient(60px 40px at 18% 82%, rgba(122,74,37,.55), transparent 70%), radial-gradient(90px 50px at 88% 12%, rgba(122,74,37,.45), transparent 70%), radial-gradient(40px 70px at 96% 70%, rgba(80,50,25,.5), transparent 70%),
  repeating-linear-gradient(97deg, rgba(255,255,255,.02) 0 2px, transparent 2px 9px), linear-gradient(160deg, #6b7151, #4f5540 55%, #3f4433);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.18), inset 0 -4px 10px rgba(0,0,0,.45), 0 18px 40px rgba(0,0,0,.75); }
.sB-plate { margin: 0 auto 10px; width: max-content; padding: 3px 12px; border-radius: 3px; font: 700 10px "Chakra Petch", sans-serif; letter-spacing: .22em; color: #2a2414; background: linear-gradient(#d8c88e, #a8955a); box-shadow: inset 0 1px 0 #fff6, 0 1px 2px #000a; }
.sB-tube { padding: 14px; border-radius: 46px / 40px; background: radial-gradient(ellipse at 50% 40%, #4a3d26, #1f190f); box-shadow: inset 0 3px 8px #000, 0 1px 0 rgba(255,255,255,.2); }
.sB .glass { height: 240px; border-radius: 40px / 34px; box-shadow: inset 0 0 40px rgba(0,0,0,.95); }
.sB .glass .glare { background: radial-gradient(110% 70% at 30% 5%, rgba(220,255,200,.16), transparent 45%), radial-gradient(130% 110% at 50% 50%, transparent 55%, rgba(0,0,0,.75)); }
.sB-panel { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 12px; padding: 8px 10px 4px; border-radius: 10px; background: linear-gradient(#3a3f2e, #2c3023); box-shadow: inset 0 2px 5px #000a; }
.knob { position: relative; width: 44px; height: 54px; text-align: center; }
.knob i { display: block; margin: 0 auto; width: 36px; height: 36px; border-radius: 50%; background: radial-gradient(circle at 38% 30%, #6a4a30, #2a1a0e 70%); box-shadow: 0 3px 4px #000, inset 0 0 0 3px #1a110a; position: relative; }
.knob i::after { content: ""; position: absolute; left: 50%; top: 3px; width: 3px; height: 12px; margin-left: -1.5px; background: #e8dcb8; border-radius: 2px; }
.knob label, .sw label { display: block; margin-top: 3px; font: 9px "Special Elite", monospace; color: #d8cfaf; white-space: nowrap; }
.sB-pwr { width: 38px; height: 38px; border-radius: 50%; border: 0; background: radial-gradient(circle at 40% 35%, #ff6a4a, #9a1a0a 70%); box-shadow: 0 0 0 4px #b8b8b0, 0 0 0 6px #555, 0 4px 6px #000; }
.sB.on .sB-pwr { box-shadow: 0 0 0 4px #b8b8b0, 0 0 0 6px #555, 0 4px 6px #000, 0 0 16px #ff4a2a; }
.sw { position: relative; width: 52px; height: 54px; text-align: center; }
.sw .base { display: block; margin: 0 auto; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(#cfcfc6, #6a6a64); box-shadow: 0 2px 3px #000; position: relative; }
.sw .bat { position: absolute; left: 50%; top: -4px; margin-left: -4px; width: 8px; height: 22px; border-radius: 4px; background: linear-gradient(90deg, #777, #eee, #777); transform-origin: 50% 100%; box-shadow: 0 2px 2px #000; }
.sB-fs { width: 30px; height: 30px; border: 0; border-radius: 5px; background: linear-gradient(#d8d2b8, #9a947c); font: 14px sans-serif; color: #2a2414; box-shadow: 0 2px 0 #222, inset 0 1px 0 #fff8; }
.tape { position: absolute; right: 28px; top: 40px; padding: 4px 10px; transform: rotate(6deg); font: 12px "Special Elite", monospace; color: #3a2a10; background: rgba(230,215,160,.92); box-shadow: 0 2px 4px #0008; clip-path: polygon(2% 0, 98% 4%, 100% 96%, 0 100%); }
.sB .port { left: 26px; bottom: -6px; }
.rv { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #c8c4a8, #3e3a2a 70%); box-shadow: 0 1px 1px #000; }

/* C · Sphera (retro-futuristic, space age) */
.sC { width: 440px; height: 410px; position: relative; }
.sC-orb { position: absolute; left: 20px; top: 0; width: 400px; height: 330px; border-radius: 50% / 48%;
  background: radial-gradient(70% 60% at 32% 22%, #ffffff, #eef0f4 35%, #c9ced8 70%, #8a91a0); box-shadow: inset -18px -24px 40px rgba(60,70,90,.45), inset 10px 10px 30px rgba(255,255,255,.8), 0 24px 40px rgba(0,0,0,.6); }
:root[data-ui="hw"] .sC-orb { background: radial-gradient(70% 60% at 32% 22%, #fff7e8, #eadcc2 35%, #c2ad8a 70%, #7d6a4c); }
.sC-ring { position: absolute; left: 44px; top: 44px; right: 44px; bottom: 50px; border-radius: 42% / 46%; padding: 9px;
  background: conic-gradient(from 210deg, #f4f6fa, #8d95a3, #ffffff, #6d7584, #f4f6fa, #9aa2b0, #f4f6fa); box-shadow: 0 0 0 2px rgba(0,0,0,.25), 0 6px 14px rgba(0,0,0,.35), inset 0 0 6px rgba(0,0,0,.4); }
.sC .glass { width: 100%; height: 100%; border-radius: 40% / 44%; box-shadow: inset 0 0 36px rgba(0,0,0,.95); }
.sC .glass .glare { background: radial-gradient(90% 60% at 30% 12%, rgba(255,255,255,.22), transparent 40%), radial-gradient(120% 100% at 50% 50%, transparent 55%, rgba(0,0,0,.7)); }
.sC-neon { position: absolute; left: 36px; top: 36px; right: 36px; bottom: 42px; border-radius: 43% / 47%; border: 2px solid var(--a2); box-shadow: 0 0 14px var(--a2), inset 0 0 10px var(--a2); opacity: .25; pointer-events: none; }
.sC.on .sC-neon { opacity: .95; }
.sC-name { position: absolute; left: 0; right: 0; top: 296px; text-align: center; font: 9px "Michroma", sans-serif; letter-spacing: .35em; color: #6a7282; }
.sC-neck { position: absolute; left: 190px; top: 322px; width: 60px; height: 24px; background: linear-gradient(90deg, #6d7584, #f4f6fa, #6d7584); }
.sC-base { position: absolute; left: 30px; right: 30px; top: 340px; height: 62px; border-radius: 31px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 18px;
  background: radial-gradient(80% 120% at 50% 0%, #ffffff, #d6dae2 60%, #9aa1ae); box-shadow: inset 0 -6px 12px rgba(60,70,90,.35), 0 12px 24px rgba(0,0,0,.55); }
:root[data-ui="hw"] .sC-base { background: radial-gradient(80% 120% at 50% 0%, #fff7e8, #e2d2b4 60%, #a8916c); }
.cb { width: 34px; height: 34px; border-radius: 50%; border: 0; font: 12px "Michroma", sans-serif; color: #2a3140; background: radial-gradient(circle at 40% 30%, #ffffff, #b9c0cc 70%); box-shadow: 0 0 0 2px #e8ebf0, 0 0 0 3px rgba(0,0,0,.2), 0 3px 5px rgba(0,0,0,.35); }
.cb.lit { box-shadow: 0 0 0 2px var(--a2), 0 0 12px var(--a2), 0 3px 5px rgba(0,0,0,.35); }
.cb.pw { background: radial-gradient(circle at 40% 30%, #ff9ab0, var(--m) 70%); color: #fff; }
.clever { position: relative; width: 62px; height: 40px; margin-left: 6px; }
.clever .track { position: absolute; left: 4px; right: 4px; top: 12px; height: 10px; border-radius: 5px; background: linear-gradient(#6d7584, #2a3140); box-shadow: inset 0 2px 3px #000a; }
.clever .bead { position: absolute; top: 5px; left: 2px; width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #c9ced8 50%, #6d7584); box-shadow: 0 3px 5px rgba(0,0,0,.45); }
.clever.lit .bead { box-shadow: 0 3px 5px rgba(0,0,0,.45), 0 0 14px var(--a1); }

};

const kindOf = s => (s.add !== undefined ? 'add' : s.remove !== undefined ? 'remove' : s.set ? 'set' : s.pattern ? 'pattern' : s.rack ? 'rack' : 'other');
const stepsOf = song => buildSteps(song).map(s => ({ at: s.at, add: s.add, remove: s.remove, kind: kindOf(s), say: s.say ? sayText(s.say, 'en') : undefined }));

// a song measured part by part (its sections): what plays at the middle of each, with the same measures as the radio

    let a = 0; const sec = secs.find(s => (a += s.bars) > i * chunk) || secs[secs.length - 1];
    return { name: sec.name, bars: Math.min(chunk, total - i * chunk) };
  });
  let at = 0;

    const mid = at + Math.floor(sec.bars / 2), st = stateAt(abs, mid).song;
    const on = st.tracks.map(t => {
      if (t.type === 'voice') return t;
      const c = (t.clips || []).find(c => mid >= c.start && mid < c.start + c.bars);
      return c && !t.mute ? { ...t, settings: { ...t.settings, ...(c.set || {}) } } : { ...t, mute: true };
    });
    const state = { tracks: on }, m = curveParts(state), says = (song.build || []).filter(s => s.say && s.at >= at && s.at < at + sec.bars).length;
    at += sec.bars;
    return { role: String(sec.name || 'part').toLowerCase(), energy: clamp(energyOf(state)), ...m, voice: says ? clamp(talk + 0.1 * says) : talk * 0.5 };
  });

  let steps = stepsOf(song);
  if (!steps.length) {
    let prev = new Set();
    at = 0;
    secs.forEach(sec => {
      const now = new Set(tracks.filter(t => (t.clips || []).some(c => c.start < at + sec.bars && c.start + c.bars > at)).map(t => t.id));
      const add = [...now].filter(id => !prev.has(id)), remove = [...prev].filter(id => !now.has(id));
      if (add.length) steps.push({ at, add, kind: 'add' });
      if (remove.length) steps.push({ at, remove, kind: 'remove' });
      prev = now; at += sec.bars;
    });

// The soul of a song. ctx (radio songs): { plan, entry, opts } from the director.
// Out: what the views read (the shape of the v3 mockups' song files), plus the hash and signature.
function soulData(song, ctx = {}) {
  const { plan, entry = {}, opts = {} } = ctx, secs = song.sections || [], first = secs[0] || {};
  const bars = secs.reduce((a, s) => a + s.bars, 0);
  const seed = String(song.seed || (ctx.seed && `${ctx.seed}-${ctx.n ?? 0}`) || song.id || song.title || 'soul');
  const base = { seed, title: song.title || 'Untitled', key: entry.key || first.key || song.key || 'A', bpm: Math.round(entry.bpm || first.bpm || song.bpm || 120), meter: entry.meter || first.meter || '4/4', bars };
  let out;

      roles: plan.plan.map(d => d.role), energy: plan.plan.map(d => d.target), max: densityMax(plan),
      density: C.map(c => val(c, 'density')), brightness: C.map(c => val(c, 'brightness')), tension: C.map(c => val(c, 'tension')), voice: C.map(c => val(c, 'voice')),

    const avg = k => P.reduce((a, p) => a + p[k], 0) / P.length;
    const h = seedHash(seed);

      opts: { chaos: Math.round(hashOf(h, 5) * 100) / 100, energy: Math.round(avg('energy') * 100) / 100, complexity: Math.round(avg('density') / m.max * 100) / 100, talk: Math.round(avg('voice') * 100) / 100 },
      roles: P.map(p => p.role), energy: P.map(p => p.energy), max: m.max,
      density: P.map(p => p.density), brightness: P.map(p => p.brightness), tension: P.map(p => p.tension), voice: P.map(p => p.voice),
      tracks: m.tracks.map(t => ({ id: t.id, type: t.type, name: t.name || t.id })), steps: m.steps, speaker: null,
    };

  return { ...out, hash, hex: hash.toString(16).toUpperCase().padStart(8, '0') };
}

// the curves the views read, all 0..1 (density over the song's most)
const soulCurves = D => ({ energy: D.energy, density: D.density.map(x => x / Math.max(1, D.max)), brightness: D.brightness, tension: D.tension, voice: D.voice });

// is a track playing at a bar (from the steps)
function trackOn(D, id, bar) {
  let on = !D.steps.some(s => list(s.add).includes(id));
  for (const s of D.steps) { if (s.at > bar) break; if (list(s.add).includes(id)) on = true; if (list(s.remove).includes(id)) on = false; }
  return on;
}

// the views, their default per song (from the seed) and the lines of the overlays (English, the screens' language)
const VIEWS = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', 'j'];
const VIEW_NAMES = { a: 'Tracker', b: 'Terrain', c: 'Sphere', d: 'Lattice', e: 'Strands', f: 'Landscape', g: 'Particles', h: 'Halftone', i: 'Aura', j: 'Spectrum' };
const CRT_VIEWS = ['a', 'b', 'c'];
const defaultView = D => VIEWS[Math.floor(hashOf(D.hash, 1) * VIEWS.length)];
const PHRASES = ['ANALYZING SONG SOUL', 'TUNING IN', 'DISSECTING THE GROOVE', 'SEEING ITS INSIDES', 'READING THE SEED', 'MAPPING THE ENERGY', 'DECODING THE PULSE', 'LISTENING TO THE BONES', 'CALIBRATING THE SPECTRUM', 'TRACING THE HOOK', 'COUNTING THE BARS', 'WAKING THE DIRECTOR',
  'DECIPHERING THE MONOLITH', 'SCULPTING THE TRACES', 'SOMETHING COMING FROM THE VOID', 'EVENT HORIZON INTERFERENCE', 'A SIGNAL FROM THE DARK', 'DETECTING... NOT ALONE', 'VOID... BREAK', 'VOID... NOT EMPTY', 'CHOPPING DOWN THE SOUL', 'LAYING IT BARE', 'REGRESSION... FIXED', 'LAGGING...', 'A GLITCH IN THE MATRIX', 'UPLOAD... SYNC', 'DOWNLOADING SOUL',
  'OPENING THE POD BAY DOORS', 'FOLLOW THE WHITE RABBIT', 'THE SHIP IS LISTENING', 'VOICES IN THE STATIC', 'IT KNOWS YOUR NAME', 'DON\'T LOOK BEHIND THE BASSLINE', 'HYPERSLEEP... ENDING', 'SPECIMEN CONTAINED', 'TRANSMISSION INTERCEPTED', 'THE DEEP IS HUMMING', 'COLD BOOT · SOUL CORE', 'GHOST IN THE SEQUENCER', 'ENTERING THE VOID', 'SHE IS IN THE WALLS', 'DATA MOSH... STABLE', 'WE ARE BEING WATCHED'];
const RECAL = ['RECALIBRATING', 'SIGNAL DRIFT', 'INTERFERENCE DETECTED', 'REWRITING THE FUTURE', 'RE-READING THE SOUL', 'MUTATION IN PROGRESS', 'THE SOUL SHIFTED', 'PATCHING THE TIMELINE', 'SPLICING NEW DNA', 'ANOMALY ABSORBED'];

// Song soul views (#46), ported from the v3 mockups (docs/soul/v3): ten views drawn on an offscreen canvas of
// 1200×760 logical pixels, then fitted into the stage. A to C are CRT screens (green phosphor, amber in HW);
// D to J are colour views that take their hue from the visual and pass through a retro amber filter in HW.
// Everything a song does differently comes from its seed (H32); small events come and go in time (ev).


function createSoulRenderer({ phone = false } = {}) {
  const cv = document.createElement('canvas'), main = cv.getContext('2d');
  let g = main;
  const W = 1200, H = 760, QF = phone ? 0.6 : 1;
  let K = 1, D = null, N = 1, curves = {}, NAMES = [], seedHash = 0, hex = '', HW = false, hueShift = 0;
  let P, P2, DIM, PRGB, tNow = 0, barNow = 0, beatNow = 0, bpb = 4, retroDone = false, lastCaption = null;
  const setTheme = hw => {
    HW = hw; P = HW ? '#ffb347' : '#5dff8a'; P2 = HW ? '#ffe2a8' : '#b8ffcb'; DIM = HW ? '#7a4a12' : '#1f7a3c'; PRGB = HW ? '255,179,71' : '93,255,138';
  };
  setTheme(false);
  // soft parts (blurred blobs, glow bands) drawn at a third of the size: a blur there costs a fraction of a full one
  const lc = document.createElement('canvas').getContext('2d'), LS = 1 / 3;
  let blurK = 0.5;
  const blur = px => `blur(${(px * blurK).toFixed(1)}px)`;
  function lowres(draw) {
    lc.canvas.width = Math.ceil(W * LS); lc.canvas.height = Math.ceil(H * LS); lc.setTransform(LS, 0, 0, LS, 0, 0);
    g = lc; blurK = LS / 2;
    try { draw(); } finally { g = main; blurK = K / 2; lc.filter = 'none'; }
    g.drawImage(lc.canvas, 0, 0, W, H);
  }
  const H32 = (...xs) => hashOf(seedHash, ...xs);
  const ev = (t, salt, period, dur, p) => eventAt(seedHash, t, salt, period, dur, p);
  const bell = k => Math.sin(Math.PI * k);
  // a block of the canvas drawn in big pixels for a moment
  const tmp = document.createElement('canvas'), tg = tmp.getContext('2d');
  function pixelate(x, y, w, h, size) {
    tmp.width = Math.max(1, Math.round(w / size)); tmp.height = Math.max(1, Math.round(h / size));
    tg.drawImage(cv, x * K, y * K, w * K, h * K, 0, 0, tmp.width, tmp.height);

  }

  const val = (k, t) => smooth(curves[k], t);

  const bar = t => Math.max(0, Math.min(D.bars - 0.001, barNow - (tNow - t) * D.bpm / 60 / bpb));
  const pos = t => bar(t) / D.bars;
  const beat = t => (((beatNow - (tNow - t) * D.bpm / 60) % 1) + 1) % 1;
  const hsl = (hh, s, l, a = 1) => `hsla(${hh},${s}%,${l}%,${a})`;
  const T = (s, x, y, size, c, align = 'left', w = 400, f = 'Space Grotesk') => { g.font = `${w} ${size}px "${f}", sans-serif`; g.fillStyle = c; g.textAlign = align; g.fillText(s, x, y); };
  const M = (s, x, y, size, c, align = 'left') => T(s, x, y, size, c, align, 400, 'JetBrains Mono');
  const proj = (x, y, z, d = 900) => { const s = d / (d + z); return [W / 2 + x * s, H / 2 + y * s, s]; };
  const rotY = (p, a) => [p[0] * Math.cos(a) + p[2] * Math.sin(a), p[1], -p[0] * Math.sin(a) + p[2] * Math.cos(a)];
  const rotX = (p, a) => [p[0], p[1] * Math.cos(a) - p[2] * Math.sin(a), p[1] * Math.sin(a) + p[2] * Math.cos(a)];
  const playing = (tr, b) => trackOn(D, tr.id, b);
  function caption(title, color, sub) {
    if (HW && !retroDone) { lastCaption = title; return; }
    T(title.toUpperCase(), 40, 56, 13, sub, 'left', 600);
    T(D.title, 40, 92, 34, color, 'left', 600);
    M(`${D.key} · ${D.bpm} BPM · ${D.meter} · ${D.shape.toUpperCase()} · SEED ${D.seed} · ${hex}`, 40, 118, 12, sub);
    M(`BAR ${String(Math.floor(bar(tNow)) + 1).padStart(3, '0')} / ${D.bars}`, W - 40, 56, 12, sub, 'right');
  }

  // phosphor colours: set per frame from the theme (green, or amber in HW)
  const font = (s, f = 'Share Tech Mono') => { g.font = `${s}px "${f}", monospace`; };
  const glow = (b = 8, c = P) => { g.shadowBlur = b; g.shadowColor = c; };
  const noGlow = () => { g.shadowBlur = 0; };
  const text = (s, x, y, size = 14, c = P, align = 'left', f) => { font(size, f); g.fillStyle = c; g.textAlign = align; glow(6, c); g.fillText(s, x, y); noGlow(); };
  // the CRT glass: the glow behind and the scanlines and vignette in front, drawn once per size and theme
  const layers = { key: '', base: document.createElement('canvas'), over: document.createElement('canvas') };
  function crtLayers() {
    const key = `${HW}:${K}`; if (layers.key === key) return layers;
    layers.key = key;
    for (const c of [layers.base, layers.over]) { c.width = Math.round(W * K); c.height = Math.round(H * K); }
    const b = layers.base.getContext('2d'), o = layers.over.getContext('2d');
    b.setTransform(K, 0, 0, K, 0, 0); o.setTransform(K, 0, 0, K, 0, 0);
    const r = b.createRadialGradient(W / 2, H / 2, 100, W / 2, H / 2, 760); r.addColorStop(0, HW ? '#140c03' : '#03140a'); r.addColorStop(1, '#000'); b.fillStyle = r; b.fillRect(0, 0, W, H);
    o.fillStyle = 'rgba(0,0,0,.28)'; for (let y = 0; y < H; y += 3) o.fillRect(0, y, W, 1);
    const v = o.createRadialGradient(W / 2, H / 2, 300, W / 2, H / 2, 800); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.65)'); o.fillStyle = v; o.fillRect(0, 0, W, H);
    return layers;

  const crtOver = () => g.drawImage(crtLayers().over, 0, 0, W, H);

    let s = seedHash; const rnd = () => ((s = Math.imul(s ^ (s >>> 15), 2246822507) ^ Math.imul(s ^ (s >>> 13), 3266489909)) >>> 0) / 4294967296;
    g.save(); g.translate(cx, cy); g.rotate(spin); g.strokeStyle = P; g.lineWidth = 1.2; glow(10);

    sg.font = `600 ${11 * d}px "Share Tech Mono", monospace`; const tag = '◉ SOUL DISPLAY · OVERRIDE'; const tw = sg.measureText(tag).width;
    sg.globalAlpha = ss; sg.fillStyle = 'rgba(0,0,0,.65)'; sg.fillRect(12 * d, h - 30 * d, tw + 16 * d, 20 * d);
    sg.fillStyle = ui === 'hw' ? '#ffb347' : getComputedStyle(document.documentElement).getPropertyValue('--a2'); sg.fillText(tag, 20 * d, h - 16 * d); sg.globalAlpha = 1;
  }
}

// ---------- demo script (the video) and states for stills ----------
function demo(at = now() + .5) {
  let t = at;
  const say = (txt, d = 2.6) => caps.push({ at: t, txt, d });
  say('The stage shows Edgerunners. ⏻ Soul display opens the display beside it.', 3); t += 1.6;
  say('Stage shrinks · hatch opens · display comes out and switches on', 3.2); t = powerOn(t); t += 2.2;
  stepView(t, 1); say('◀ ▶ change the view'); t += 1.6; stepView(t, 1); t += 1.6;
  toggleLock(t); say('Lock: the view stays when the song changes'); t += 1.6;
  say('Override visual: a cable takes the soul to the stage'); t = overrideOn(t) + 2.6;
  say('Override off: the stage shows Edgerunners again'); t = overrideOff(t) + 1.2;
  for (let i = 0; i < 4; i++) { say(`Shell lever: ${SHELL_NAMES[SHELLS[(SHELLS.indexOf(S.shell) + 1) % 4]]}`, 3.2); t = nextShell(t) + 2.2; if (i === 1) { stepView(t, 1); t += 1.4; } }
  say('Override with another shell'); t = overrideOn(t) + 2.4; t = overrideOff(t) + .8;
  say('Power off: the reverse'); t = powerOff(t) + 1.5;
  say('', .1);
  window.DEMO_END = t;
}
const caps = []; window.CAPS = caps;
setInterval(() => { const t = now(), c = [...caps].reverse().find(x => x.at <= t); const el = $('#caption'); if (c && t - c.at < c.d && c.txt) { el.textContent = c.txt; el.style.opacity = 1; } else el.style.opacity = 0; }, 60);

// states for stills: ?state=open|override|closed (everything already done at t=0), ?demo=1 plays the script from 0
document.documentElement.dataset.ui = ui;
$('#top').src = `assets/${ui}-top.jpg`; $('#below').src = `assets/${ui}-below.jpg`;
if (Q.get('state') === 'open' || Q.get('state') === 'override') { powerOn(-10); if (Q.get('view')) { S.view = Q.get('view'); mark(marks.view, -10, { v: S.view }); } if (Q.get('state') === 'override') overrideOn(-5); if (fixedT === null) fixedT = null; }
if (Q.get('demo')) demo(Number(Q.get('at') || .8));
document.fonts.ready.then(() => { requestAnimationFrame(frame); setTimeout(() => (document.body.dataset.ready = '1'), 600); });
</script>
